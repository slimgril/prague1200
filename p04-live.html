<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="stylesheet" href="global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P04 - 布拉格之春的交響曲</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0A0A0A; font-family: sans-serif; }

        .p04-container { display: flex; width: 100%; height: 100%; position: relative; }

        /* 左欄 40% */
        .p03-left-panel {
            width: 40%; height: 100%;
            background-color: #0A0A0A;
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .hero-image {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center center;
            transition: filter 0.5s ease;
        }

        /* 右欄 60% */
        .p03-right-panel {
            width: 60%; height: 100%;
            background-color: #F4F1EA;
            background-image: linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100% 24px;
            position: relative;
        }

        /* 007 Gun Barrel 遮罩 */
        .gun-barrel-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle 160px at var(--mouse-x, 50%) var(--mouse-y, 50%), transparent 60%, rgba(10,10,10,0.85) 100%);
            opacity: 0; transition: opacity 0.4s ease; pointer-events: none; z-index: 5;
        }
        .p03-left-panel:hover .gun-barrel-overlay { opacity: 1; }

        /* 黃銅時光拉桿 */
        .timeline-slider-container {
            position: absolute; top: 8%; left: 10%;
            width: 80%; text-align: center; z-index: 50;
        }
        .time-labels { display: flex; justify-content: space-between; color: #8A6D3B; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        .brass-slider {
            width: 100%; -webkit-appearance: none;
            background: linear-gradient(to right, #332211, #D4AF37, #332211);
            height: 6px; border-radius: 3px; outline: none; cursor: pointer;
        }
        .brass-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: radial-gradient(circle, #FFF, #D4AF37, #8A6D3B);
            border: 2px solid #332211; box-shadow: 0 0 8px rgba(212,175,55,0.8);
        }

        /* 地圖城堡容器 */
        .map-hotspots-container {
            position: absolute; top: 22%; left: 8%;
            width: 84%; height: 44%;
            border: 1px solid rgba(138,109,59,0.2); border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background-image: url('surprise/p04_right.png');
            background-size: cover;
            background-position: center center;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .map-hotspots-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10; pointer-events: none; }

        /* 熱區音符 */
        .map-node {
            position: absolute; width: 34px; height: 34px;
            border: 2px solid #D4AF37; background-color: rgba(10,10,10,0.75);
            border-radius: 50%; cursor: pointer; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            color: #D4AF37; font-weight: bold; font-size: 13px;
            box-shadow: 0 0 10px rgba(212,175,55,0.5); transition: all 0.3s ease;
        }
        .map-node:hover { transform: scale(1.2); box-shadow: 0 0 15px #D4AF37; background-color: #D4AF37; color: #0A0A0A; }

        /* tooltip 改為照片 */
        .node-tooltip {
            position: absolute; bottom: 44px; left: 50%;
            transform: translateX(-50%) scale(0.9);
            width: 200px; height: 150px;
            border: 2px solid #D4AF37; border-radius: 6px;
            overflow: hidden; opacity: 0;
            pointer-events: none; transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7); z-index: 100;
        }
        .node-tooltip img,
        .node-tooltip video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .map-node:hover .node-tooltip { opacity: 1; transform: translateX(-50%) scale(1); }

        /* 拍立得 — 膠捲效果 */
        .p03-polaroid {
            position: absolute; bottom: 4%; right: 6%;
            width: 140px;
            padding: 6px 13px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 0 1px #3A3A3A;
            transform: rotate(6deg); transform-origin: bottom right;
            transition: all 0.4s ease; cursor: pointer; z-index: 25;
            /* 多層背景：左齒孔 ＋ 右齒孔 ＋ 中間底色 */
            background:
                repeating-linear-gradient(
                    to bottom,
                    #1C1C1C 0px 3px,
                    #E8E0D0 3px 13px,
                    #1C1C1C 13px 20px
                ) left 0 / 12px 100% no-repeat,
                repeating-linear-gradient(
                    to bottom,
                    #1C1C1C 0px 3px,
                    #E8E0D0 3px 13px,
                    #1C1C1C 13px 20px
                ) right 0 / 12px 100% no-repeat,
                #1C1C1C;
        }
        .p03-polaroid img {
            width: 100%; height: auto; display: block;
            filter: contrast(1.08) saturate(0.85) sepia(0.1);
            transition: filter 0.4s ease;
        }
        .p03-polaroid:hover { transform: rotate(6deg) scale(1.08); box-shadow: 0 12px 40px rgba(0,0,0,0.75); }
        .p03-polaroid:hover img { filter: contrast(1.15) saturate(1.1) sepia(0); }

        /* 花框 */
        .floral-frame {
            position: absolute; inset: 14px;
            border: 1.5px solid rgba(184,150,12,0.5);
            pointer-events: none; z-index: 2;
        }
        /* SVG 花角 */
        .floral-corner {
            position: absolute;
            width: 96px; height: 96px;
            pointer-events: none; z-index: 3; opacity: 0.88;
        }
        .floral-corner-tl { top: -4px; left: -4px; }
        .floral-corner-tr { top: -4px; right: -4px; transform: scaleX(-1); }
        .floral-corner-bl { bottom: -4px; left: -4px; transform: scaleY(-1); }
        .floral-corner-br { bottom: -4px; right: -4px; transform: scale(-1,-1); }
        .p03-poem-zone {
            position: absolute;
            top: calc(66% + 1.5em);
            left: 8%;
            width: 380px; text-align: left; line-height: 2.6;
            font-weight: 700; font-size: 15px;
            z-index: 40; pointer-events: none;
        }
        @keyframes fadeInPoem {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .poem-line {
            display: block;
            color: #C2186B;
            text-shadow: 0 1px 6px rgba(180,0,80,0.2);
            opacity: 0;
        }
        .poem-line.visible {
            animation: fadeInPoem 3s ease forwards;
        }
        .poem-line:nth-child(1).visible { animation-delay: 0s; }
        .poem-line:nth-child(2).visible { animation-delay: 6s; }
        .poem-line:nth-child(3).visible { animation-delay: 12s; }
        .poem-line:nth-child(4).visible { animation-delay: 18s; }
    </style>
</head>

<script>
    /* 007 槍管滑鼠動態追蹤（左欄改成 iframe 模組後，gunBarrel/heroImg 這兩個
       元素已經不存在了，這裡加上判斷式，避免每次滑鼠移動都拋錯） */
    const leftPanel = document.getElementById('leftPanel');
    leftPanel.addEventListener('mousemove', (e) => {
        const gunBarrel = document.getElementById('gunBarrel');
        if (!gunBarrel) return;
        const rect = leftPanel.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        gunBarrel.style.setProperty('--mouse-x', `${x}%`);
        gunBarrel.style.setProperty('--mouse-y', `${y}%`);
    });

    /* Web Audio API 雙音軌 */
    let audioCtx = null, bgmOsc = null, bgmGain = null, b7Gain = null;
    const b7 = document.getElementById('beethoven7');

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // GainNode 放大貝多芬七號（突破 HTML5 volume 1.0 上限）
        const b7Source = audioCtx.createMediaElementSource(b7);
        b7Gain = audioCtx.createGain();
        b7Gain.gain.value = 2.8;
        b7Source.connect(b7Gain);
        b7Gain.connect(audioCtx.destination);
        b7.play().catch(() => {});

        // oscillator 供互動 SFX
        bgmOsc = audioCtx.createOscillator();
        bgmGain = audioCtx.createGain();
        bgmOsc.type = 'triangle';
        bgmOsc.frequency.setValueAtTime(73.41, audioCtx.currentTime);
        bgmGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
        bgmOsc.connect(bgmGain);
        bgmGain.connect(audioCtx.destination);
        bgmOsc.start();
    }

    function playMusicBox() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const freqs = [587.3, 739.9, 880.0, 1174.7];
        freqs.forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.08);       // ✅ 修正
            g.gain.setValueAtTime(0.06, now + i * 0.08);           // ✅ 修正
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(now + i * 0.08 + 0.5);
        });
    }

    function playSymphony() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const notes = [293.7, 349.2, 440.0, 587.3];
        notes.forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(f, now + i * 0.1);        // ✅ 修正
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(600, now);
            g.gain.setValueAtTime(0.12, now + i * 0.1);            // ✅ 修正
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.8);
            osc.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(now + i * 0.1 + 0.9);
        });
    }

    const slider = document.getElementById('timeSlider');
    const poemZone = document.getElementById('poemZone');
    const polaroid = document.getElementById('polaroidPic');
    let hasPlayedLeft = false, hasPlayedRight = false;
    let poemTimers = [];

    function showPoemLines() {
        const lines = Array.from(poemZone.querySelectorAll('.poem-line'));
        lines.forEach(l => l.classList.remove('visible'));
        void poemZone.offsetWidth; // 強制 reflow，重置動畫
        lines.forEach(l => l.classList.add('visible'));
    }
    function hidePoemLines() {
        poemTimers.forEach(clearTimeout);
        poemTimers = [];
        poemZone.querySelectorAll('.poem-line').forEach(l => l.classList.remove('visible'));
    }

    slider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        const heroImg = document.getElementById('heroImg'); // 左欄已改成 iframe 模組，heroImg 可能不存在
        if (val <= 30) {
            polaroid.style.transform = 'rotate(6deg) scale(1.15)';
            hidePoemLines();
            if (heroImg) heroImg.style.filter = 'sepia(0) brightness(1)';
            if (b7Gain) b7Gain.gain.value = 1.4;
            if (!hasPlayedLeft) { playMusicBox(); hasPlayedLeft = true; hasPlayedRight = false; }
        } else if (val >= 70) {
            if (heroImg) heroImg.style.filter = 'sepia(0.5) brightness(0.65)';
            if (b7Gain) b7Gain.gain.value = 3.5;
            if (!hasPlayedRight) { playSymphony(); showPoemLines(); hasPlayedRight = true; hasPlayedLeft = false; }
        } else {
            polaroid.style.transform = 'rotate(6deg) scale(1)';
            hidePoemLines();
            if (heroImg) heroImg.style.filter = 'sepia(0) brightness(1)';
            if (b7Gain) b7Gain.gain.value = 2.8;
            hasPlayedLeft = false; hasPlayedRight = false;
        }
    });

    /* Lightbox 觸發 */
    function triggerLightbox(src, e) {
        if (e) e.stopPropagation();
        const isVideo = /\.(mov|mp4|webm)$/i.test(src);
        if (window.parent && window.parent.handleLightbox) {
            window.parent.handleLightbox(src, isVideo ? 'video' : 'image');
        } else {
            showInlineLightbox(src, isVideo);
        }
    }

    function showInlineLightbox(src, isVideo) {
        const existing = document.getElementById('p04-lightbox');
        if (existing) existing.remove();
        const overlay = document.createElement('div');
        overlay.id = 'p04-lightbox';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;';
        const closeOverlay = () => {
            const v = overlay.querySelector('video');
            if (v) v.pause();
            overlay.remove();
        };
        overlay.onclick = closeOverlay;
        if (isVideo) {
            const vid = document.createElement('video');
            vid.src = src;
            vid.controls = true;
            vid.autoplay = true;
            vid.style.cssText = 'max-width:90vw;max-height:85vh;border:2px solid #D4AF37;border-radius:6px;';
            vid.onclick = (ev) => ev.stopPropagation(); // 影片維持點擊控制列，不因點擊本身關閉
            overlay.appendChild(vid);
        } else {
            const img = document.createElement('img');
            img.src = src;
            img.style.cssText = 'max-width:90vw;max-height:85vh;border:2px solid #D4AF37;border-radius:6px;object-fit:contain;';
            // 點照片本身就關閉（不再只能點旁邊背景，避免點到左右邊緣翻頁熱區）
            img.onclick = (ev) => { ev.stopPropagation(); closeOverlay(); };
            overlay.appendChild(img);
        }
        document.body.appendChild(overlay);
    }
</script>
