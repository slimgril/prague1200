<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P04 - 布拉格之春的交響曲</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0A0A0A; font-family: sans-serif; }

        .p04-container { display: flex; width: 100%; height: 100%; position: relative; }

        /* 左欄 40%：改成真正的 Before/After 圖片對比（禮服醫師 vs 便服醫師），
           取代原本只是切換濾鏡的假拉桿。兩張圖等高滿版疊在同一個框裡，
           上層（禮服）用 clip-path 依拉桿百分比精準裁切露出/遮住，金色
           拉桿貫穿整個對比區域高度、永遠在最上層。（沿用 P05 的作法） */
        .p03-left-panel {
            width: 40%; height: 100%;
            background-color: #0A0A0A;
            position: relative; overflow: hidden;
        }
        .compare-layer { position: absolute; inset: 0; transform: translateZ(0); }
        .hero-image {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
        }
        .compare-layer--before {
            clip-path: inset(0 calc(100% - var(--split, 50%)) 0 0);
            will-change: clip-path;
        }
        /* 垂直金色拉桿：貫穿整個對比區域高度，z-index 最高 */
        .compare-handle {
            position: absolute; top: 0; bottom: 0;
            left: var(--split, 50%);
            width: 3px; margin-left: -1.5px;
            background: linear-gradient(to bottom, #F3D77A, #D4AF37, #8A6D3B);
            box-shadow: 0 0 10px rgba(212,175,55,0.75);
            z-index: 22; pointer-events: none;
        }
        .compare-handle::before {
            content: '⇔';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 34px; height: 34px; border-radius: 50%;
            background: radial-gradient(circle, #FFF, #D4AF37, #8A6D3B);
            border: 2px solid #332211; box-shadow: 0 0 10px rgba(212,175,55,0.8);
            display: flex; align-items: center; justify-content: center;
            color: #332211; font-size: 15px; font-weight: bold;
        }
        /* 拖曳輸入層：鋪滿整個對比區域，看不見但接收拖曳／鍵盤操作 */
        .compare-drag-input {
            position: absolute; inset: 0; width: 100%; height: 100%;
            margin: 0; padding: 0; opacity: 0; cursor: ew-resize;
            -webkit-appearance: none; appearance: none;
            z-index: 23;
        }
        .compare-drag-input::-webkit-slider-thumb { -webkit-appearance: none; width: 100%; height: 100%; }
        .compare-drag-input::-moz-range-thumb { width: 100%; height: 100%; border: none; background: transparent; }
        .compare-caption {
            position: absolute; top: 4%; left: 0; right: 0;
            text-align: center; z-index: 21; pointer-events: none;
            color: #F5E9C9; font-size: 11px; letter-spacing: 0.1em;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            display: flex; justify-content: space-between; padding: 0 6%;
        }

        /* 右欄 60% */
        .p03-right-panel {
            width: 60%; height: 100%;
            background-color: #F4F1EA;
            background-image: linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100% 24px;
            position: relative;
        }

        /* 007 Gun Barrel 遮罩 */
        .gun-barrel-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle 160px at var(--mouse-x, 50%) var(--mouse-y, 50%), transparent 60%, rgba(10,10,10,0.85) 100%);
            opacity: 0; transition: opacity 0.4s ease; pointer-events: none; z-index: 5;
        }
        .p03-left-panel:hover .gun-barrel-overlay { opacity: 1; }

        /* 黃銅時光拉桿：右端要避開翻頁觸發區，所以寬度縮窄、往左移 */
        .timeline-slider-container {
            position: absolute; top: 8%; left: 8%;
            width: 66%; text-align: center; z-index: 50;
        }
        .time-labels { display: flex; justify-content: space-between; color: #8A6D3B; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        .brass-slider {
            width: 100%; -webkit-appearance: none;
            background: linear-gradient(to right, #332211, #D4AF37, #332211);
            height: 6px; border-radius: 3px; outline: none; cursor: pointer;
        }
        .brass-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: radial-gradient(circle, #FFF, #D4AF37, #8A6D3B);
            border: 2px solid #332211; box-shadow: 0 0 8px rgba(212,175,55,0.8);
        }

        /* 地圖城堡容器 */
        .map-hotspots-container {
            position: absolute; top: 22%; left: 8%;
            width: 84%; height: 44%;
            border: 1px solid rgba(138,109,59,0.2); border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background-image: url('surprise/p04_right.png');
            background-size: cover;
            background-position: center center;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .map-hotspots-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10; pointer-events: none; }

        /* 熱區音符 */
        .map-node {
            position: absolute; width: 34px; height: 34px;
            border: 2px solid #D4AF37; background-color: rgba(10,10,10,0.75);
            border-radius: 50%; cursor: pointer; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            color: #D4AF37; font-weight: bold; font-size: 13px;
            box-shadow: 0 0 10px rgba(212,175,55,0.5); transition: all 0.3s ease;
        }
        .map-node:hover { transform: scale(1.2); box-shadow: 0 0 15px #D4AF37; background-color: #D4AF37; color: #0A0A0A; }

        /* tooltip 改為照片 */
        .node-tooltip {
            position: absolute; bottom: 44px; left: 50%;
            transform: translateX(-50%) scale(0.9);
            width: 200px; height: 150px;
            border: 2px solid #D4AF37; border-radius: 6px;
            overflow: hidden; opacity: 0;
            pointer-events: none; transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7); z-index: 100;
        }
        .node-tooltip img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .map-node:hover .node-tooltip { opacity: 1; transform: translateX(-50%) scale(1); }

        /* 靠近相框上緣的熱區，往上彈出的預覽圖片空間不夠會被切掉，
           改成往下彈出 */
        .map-node.tip-below .node-tooltip { bottom: auto; top: 44px; }
        .map-node.tip-below:hover .node-tooltip { transform: translateX(-50%) scale(1); }

        /* 拍立得：放大到 130px，往內推避開翻頁觸發區 */
        .p03-polaroid {
            position: absolute; bottom: 6%; right: 11%;
            width: 130px; background: #FFFFFF; padding: 8px 8px 16px 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.22);
            transform: rotate(6deg); transform-origin: bottom right;
            transition: all 0.4s ease; cursor: pointer; z-index: 25;
        }
        /* 之前只留了 transition 跟 cursor:pointer，卻沒有寫任何
           :hover / :active 規則，滑過或點下去畫面完全沒有反應，
           看起來像壞掉一樣。補上「拿起卡片」的抬起＋擺正效果，
           滑鼠移過去或觸控按住都會有明顯回饋。 */
        .p03-polaroid:hover,
        .p03-polaroid:active {
            transform: rotate(0deg) scale(1.1) translateY(-8px);
            box-shadow: 0 16px 36px rgba(0,0,0,0.32);
            z-index: 26;
        }
        .p03-polaroid img { width: 100%; height: auto; display: block; border: 1px solid #EEE; }

        /* 詩句金句：逐行淡入 */
        .p03-poem-zone {
            position: absolute; bottom: 5%; left: 8%;
            width: 380px; text-align: left; line-height: 2.3;
            color: #332211; font-weight: 700; font-size: 15px;
            z-index: 40; pointer-events: none;
        }
        .p04-poem-line {
            opacity: 0; transform: translateY(6px);
            transition: opacity 1s ease, transform 1s ease;
        }
        .p04-poem-line.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<div class="p04-container">

    <!-- 左欄：禮服醫師／便服醫師 Before-After 對比 -->
    <div class="p03-left-panel" id="leftPanel">
        <div class="compare-caption" aria-hidden="true"><span>便服醫師</span><span>禮服醫師</span></div>
        <div class="compare-layer compare-layer--after">
            <img src="surprise/p04_right.png" class="hero-image" alt="布拉格城內便服合照">
        </div>
        <div class="compare-layer compare-layer--before" id="compareBefore">
            <img src="surprise/p04_left.png" class="hero-image" id="heroImg" alt="魯道夫音樂廳德弗札克之約禮服合照">
        </div>
        <div class="compare-handle" id="compareHandle" aria-hidden="true"></div>
        <input type="range" min="0" max="100" value="50" class="compare-drag-input" id="compareDrag"
               aria-label="拖曳比較便服醫師與禮服醫師照片">
        <div class="gun-barrel-overlay" id="gunBarrel"></div>
    </div>

    <!-- 右欄：手帳尋寶區 -->
    <div class="p03-right-panel" id="rightPanel">

        <!-- 黃銅拉桿 -->
        <div class="timeline-slider-container">
            <div class="time-labels">
                <span>年輕的我們（童心）</span>
                <span>現在的我們（在聆聽）</span>
                <span>未來的我們（透著光）</span>
            </div>
            <input type="range" min="0" max="100" value="50" class="brass-slider" id="timeSlider">
        </div>

        <!-- 金句詩區：逐行淡入 -->
        <div class="p03-poem-zone" id="poemZone">
            <span class="p04-poem-line" id="p04PoemLine1">音樂是時間留在耳膜上的代價──</span><br>
            <span class="p04-poem-line" id="p04PoemLine2">德弗札克的音符，橫跨了新世界與老城牆。</span><br>
            <span class="p04-poem-line" id="p04PoemLine3">老城廣場的暮色，見證無數晨昏，</span><br>
            <span class="p04-poem-line" id="p04PoemLine4">也留下台大醫院、哈佛醫學院畢業名醫──粘曉青與鄭惠文醫師的生命隨遊誌。</span>
        </div>

        <!-- 地圖畫布：老城廣場泰恩教堂合照 -->
        <div class="map-hotspots-container">

            <div class="map-hotspots-layer">

                <!-- ① spot1 -->
                <div class="map-node" style="left:15%;top:60%;" onclick="triggerLightbox('surprise/p04_spot1.png',event)">🎵
                    <div class="node-tooltip"><img src="surprise/p04_spot1.png" alt="spot1"></div>
                </div>

                <!-- ② spot2 -->
                <div class="map-node tip-below" style="left:78%;top:22%;" onclick="triggerLightbox('surprise/p04_spot2.png',event)">🏰
                    <div class="node-tooltip"><img src="surprise/p04_spot2.png" alt="spot2"></div>
                </div>

                <!-- ③ spot3 -->
                <div class="map-node" style="left:45%;top:40%;" onclick="triggerLightbox('surprise/p04_spot3.png',event)">⚔️
                    <div class="node-tooltip"><img src="surprise/p04_spot3.png" alt="spot3"></div>
                </div>

                <!-- ④ spot4 -->
                <div class="map-node" style="left:65%;top:52%;" onclick="triggerLightbox('surprise/p04_spot4.png',event)">⭐
                    <div class="node-tooltip"><img src="surprise/p04_spot4.png" alt="spot4"></div>
                </div>

                <!-- ⑤ clock -->
                <div class="map-node tip-below" style="left:30%;top:25%;" onclick="triggerLightbox('surprise/p04-clock-still.jpg',event)">⏰
                    <div class="node-tooltip"><img src="surprise/p04-clock-still.jpg" alt="clock"></div>
                </div>

                <!-- ⑥ salon -->
                <div class="map-node tip-below" style="left:55%;top:15%;" onclick="triggerLightbox('surprise/p04_salon.png',event)">🎨
                    <div class="node-tooltip"><img src="surprise/p04_salon.png" alt="salon"></div>
                </div>

            </div>
        </div>

        <!-- 拍立得（第五張圖）：純裝飾用，不可點擊，避免擋到翻頁、也避免彈窗曝露圖片來源 -->
        <div class="p03-polaroid" id="polaroidPic">
            <img src="surprise/image_1f6vVU.png" alt="布拉格下午茶拍立得">
        </div>

    </div>
</div>

<script>
    /* 007 槍管滑鼠動態追蹤 */
    const leftPanel = document.getElementById('leftPanel');
    leftPanel.addEventListener('mousemove', (e) => {
        const rect = leftPanel.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        document.getElementById('gunBarrel').style.setProperty('--mouse-x', `${x}%`);
        document.getElementById('gunBarrel').style.setProperty('--mouse-y', `${y}%`);
    });

    /* 滑桿互動（音效已移除） */
    const slider = document.getElementById('timeSlider');
    const poemZone = document.getElementById('poemZone');
    const polaroid = document.getElementById('polaroidPic');

    const poemLineIds = ['p04PoemLine1', 'p04PoemLine2', 'p04PoemLine3', 'p04PoemLine4'];
    /* 每行間隔3秒，讓讀者讀完這行再出現下一行 */
    function revealP04Poem() {
        poemLineIds.forEach((id, i) => {
            setTimeout(() => {
                const el = document.getElementById(id);
                if (el) el.classList.add('show');
            }, i * 3000);
        });
    }
    function hideP04Poem() {
        poemLineIds.forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.classList.remove('show');
        });
    }

    /* 時光拉桿：現在只負責金句詩區的淡入/淡出，不再連動拍立得或
       醫師照片的濾鏡（那些效果跟這顆拉桿的語意無關，之前只是剛好共用
       同一個 input 事件）。 */
    slider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        if (val >= 70) {
            revealP04Poem();
        } else {
            hideP04Poem();
        }
    });

    /* 真正的 Before/After 對比拉桿：便服醫師（下層／預設） vs 禮服醫師
       （上層）。拖曳時用 clip-path 精準裁切上層寬度，金色拉桿與拖曳輸入層
       都跟著同一個 --split 百分比走，滑鼠/觸控/鍵盤（方向鍵）都適用。
       拍立得（.p03-polaroid）刻意不連動這顆拉桿，維持原本亮度與斜貼。 */
    const compareDrag = document.getElementById('compareDrag');
    function setComparePosition(val) {
        leftPanel.style.setProperty('--split', val + '%');
    }
    setComparePosition(compareDrag.value);
    compareDrag.addEventListener('input', (e) => {
        setComparePosition(e.target.value);
    });

    /* Lightbox 觸發：目前 parent 沒有實作 handleLightbox，
       改成安靜地不做事（不要再跳 alert 曝露圖片檔名、也不要擋住翻頁） */
    function triggerLightbox(imgName, e) {
        if (e) e.stopPropagation();
        if (window.parent && window.parent.handleLightbox) {
            window.parent.handleLightbox(imgName);
        }
    }
</script>
</body>
</html>
