<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="stylesheet" href="global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P05 - 布拉格紅色電車的火藥塔漫步</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0A0A0A; font-family: sans-serif; }

        .p05-container { display: flex; width: 100%; height: 100%; position: relative; }

        /* 左欄 40% */
        .p05-left-panel {
            width: 40%; height: 100%;
            background-color: #0A0A0A;
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .hero-image {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center center;
            transition: filter 0.5s ease;
        }

        /* 右欄 60% */
        .p05-right-panel {
            width: 60%; height: 100%;
            background-color: #F4F1EA;
            background-image: linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100% 24px;
            position: relative;
        }

        /* 007 Gun Barrel */
        .gun-barrel-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle 160px at var(--mouse-x, 50%) var(--mouse-y, 50%), transparent 60%, rgba(10,10,10,0.85) 100%);
            opacity: 0; transition: opacity 0.4s ease; pointer-events: none; z-index: 5;
        }
        .p05-left-panel:hover .gun-barrel-overlay { opacity: 1; }

        /* 金邊花框 */
        .floral-frame {
            position: absolute; inset: 14px;
            border: 1.5px solid rgba(184,150,12,0.5);
            pointer-events: none; z-index: 2;
        }
        .floral-corner {
            position: absolute; width: 96px; height: 96px;
            pointer-events: none; z-index: 3; opacity: 0.88;
        }
        .floral-corner-tl { top: -4px; left: -4px; }
        .floral-corner-tr { top: -4px; right: -4px; transform: scaleX(-1); }
        .floral-corner-bl { bottom: -4px; left: -4px; transform: scaleY(-1); }
        .floral-corner-br { bottom: -4px; right: -4px; transform: scale(-1,-1); }

        /* 黃銅拉桿 */
        .timeline-slider-container {
            position: absolute; top: 8%; left: 10%;
            width: 80%; text-align: center; z-index: 50;
        }
        .time-labels { display: flex; justify-content: space-between; color: #8A6D3B; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        .brass-slider {
            width: 100%; -webkit-appearance: none;
            background: linear-gradient(to right, #332211, #D4AF37, #332211);
            height: 6px; border-radius: 3px; outline: none; cursor: pointer;
        }
        .brass-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: radial-gradient(circle, #FFF, #D4AF37, #8A6D3B);
            border: 2px solid #332211; box-shadow: 0 0 8px rgba(212,175,55,0.8);
        }

        /* 地圖容器 */
        .map-hotspots-container {
            position: absolute; top: 22%; left: 8%;
            width: 84%; height: 44%;
            border: 1px solid rgba(138,109,59,0.2); border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background-image: url('surprise/p05-bg.png');
            background-size: cover; background-position: center center;
            overflow: hidden;
        }
        .map-hotspots-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10; pointer-events: none; }

        /* 熱區節點 — 燈塔閃爍（金色） */
        .map-node {
            position: absolute; width: 36px; height: 36px;
            border: 2px solid #FFD700;
            background-color: rgba(255,215,0,0.25);
            border-radius: 50%; cursor: pointer; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            color: #FFD700; font-weight: bold; font-size: 14px;
            transition: all 0.3s ease;
            animation: lighthouseFlash 1.2s ease-in-out infinite;
        }
        .map-node:hover {
            transform: scale(1.3);
            background-color: rgba(255,215,0,0.7);
            box-shadow: 0 0 25px #FFD700, 0 0 50px #FFD700;
            animation: none;
        }
        @keyframes lighthouseFlash {
            0%   { box-shadow: 0 0 4px #FFD700; opacity: 1; }
            40%  { box-shadow: 0 0 18px #FFD700, 0 0 35px rgba(255,215,0,0.8); opacity: 1; }
            50%  { box-shadow: 0 0 2px #FFD700; opacity: 0.4; }
            60%  { box-shadow: 0 0 18px #FFD700, 0 0 35px rgba(255,215,0,0.8); opacity: 1; }
            100% { box-shadow: 0 0 4px #FFD700; opacity: 1; }
        }

        /* 詩句 — transition 模式（右下角拍立得已拿掉，金句改用右欄
           幾乎全寬，排版更舒展，不再被照片擠壓） */
        .p05-poem-zone {
            position: absolute;
            top: calc(66% + 1.5em);
            left: 8%; width: 84%;
            text-align: center; opacity: 1;
            z-index: 40; pointer-events: none;
        }
        .poem-line {
            display: block;
            color: #C2186B;
            text-shadow: 0 1px 6px rgba(180,0,80,0.2);
            font-weight: 700; font-size: 18px;
            line-height: 1.6; margin-bottom: 4px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }
        .poem-line.fade-in-active {
            opacity: 1; transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="p05-container">

    <!-- 左欄：P05 互動拉桿模組（取代原本靜態電車照，讓模組真正顯示出來） -->
    <div class="p05-left-panel" id="leftPanel">
        <iframe src="p04效果測試/p05.html" title="P05 互動拉桿展示"
                style="width:100%;height:100%;border:0;display:block;"></iframe>
    </div>

    <!-- 右欄：手帳尋寶區 -->
    <div class="p05-right-panel" id="rightPanel">

        <!-- 金邊花框 -->
        <div class="floral-frame">
            <span style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#F4F1EA;padding:0 8px;color:#A07800;font-size:13px;letter-spacing:4px;">✦ ◆ ✦</span>
            <span style="position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:#F4F1EA;padding:0 8px;color:#A07800;font-size:13px;letter-spacing:4px;">✦ ◆ ✦</span>
        </div>

        <!-- SVG 花角 -->
        <svg class="floral-corner floral-corner-tl" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
            <line x1="14" y1="88" x2="14" y2="42" stroke="#7A8C5A" stroke-width="2.5"/>
            <line x1="14" y1="88" x2="48" y2="88" stroke="#7A8C5A" stroke-width="2.5"/>
            <path d="M14 62 Q0 50 5 36" stroke="#6B7B4A" stroke-width="1.8" fill="none"/>
            <ellipse cx="6" cy="49" rx="13" ry="6" fill="#8A9C5A" transform="rotate(-45 6 49)" opacity="0.9"/>
            <path d="M14 68 Q28 55 42 60" stroke="#6B7B4A" stroke-width="1.8" fill="none"/>
            <ellipse cx="28" cy="62" rx="13" ry="6" fill="#7A8C4A" transform="rotate(20 28 62)" opacity="0.9"/>
            <circle cx="14" cy="26" r="11" fill="#F2B8A0"/><circle cx="25" cy="16" r="11" fill="#E8A890"/>
            <circle cx="36" cy="14" r="10" fill="#F2B8A0"/><circle cx="3"  cy="16" r="10" fill="#E8A890"/>
            <circle cx="3"  cy="30" r="10" fill="#F2B8A0"/><circle cx="27" cy="32" r="10" fill="#E8A890"/>
            <circle cx="14" cy="22" r="12" fill="#D4AF37"/><circle cx="14" cy="22" r="6" fill="#8A6010"/>
        </svg>
        <svg class="floral-corner floral-corner-tr" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
            <line x1="14" y1="88" x2="14" y2="42" stroke="#7A8C5A" stroke-width="2.5"/>
            <line x1="14" y1="88" x2="48" y2="88" stroke="#7A8C5A" stroke-width="2.5"/>
            <path d="M14 62 Q0 50 5 36" stroke="#6B7B4A" stroke-width="1.8" fill="none"/>
            <ellipse cx="6" cy="49" rx="13" ry="6" fill="#8A9C5A" transform="rotate(-45 6 49)" opacity="0.9"/>
            <path d="M14 68 Q28 55 42 60" stroke="#6B7B4A" stroke-width="1.8" fill="none"/>
            <ellipse cx="28" cy="62" rx="13" ry="6" fill="#7A8C4A" transform="rotate(20 28 62)" opacity="0.9"/>
            <circle cx="14" cy="26" r="11" fill="#E0C0E8"/><circle cx="25" cy="16" r="11" fill="#D0B0D8"/>
            <circle cx="36" cy="14" r="10" fill="#E0C0E8"/><circle cx="3"  cy="16" r="10" fill="#D0B0D8"/>
            <circle cx="3"  cy="30" r="10" fill="#E0C0E8"/><circle cx="27" cy="32" r="10" fill="#D0B0D8"/>
            <circle cx="14" cy="22" r="12" fill="#D4AF37"/><circle cx="14" cy="22" r="6" fill="#8A6010"/>
        </svg>
        <svg class="floral-corner floral-corner-bl" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
            <line x1="14" y1="88" x2="14" y2="42" stroke="#7A8C5A" stroke-width="2.5"/>
            <line x1="14" y1="88" x2="48" y2="88" stroke="#7A8C5A" stroke-width="2.5"/>
            <path d="M14 62 Q0 50 5 36" stroke="#6B7B4A" stroke-width="1.8" fill="none"/>
            <ellipse cx="6" cy="49" rx="13" ry="6" fill="#8A9C5A" transform="rotate(-45 6 49)" opacity="0.9"/>
            <path d="M14 68 Q28 55 42 60" stroke="#6B7B4A" stroke-width="1.8" fill="none"/>
            <ellipse cx="28" cy="62" rx="13" ry="6" fill="#7A8C4A" transform="rotate(20 28 62)" opacity="0.9"/>
            <circle cx="14" cy="26" r="11" fill="#B8D0F0"/><circle cx="25" cy="16" r="11" fill="#A8C0E0"/>
            <circle cx="36" cy="14" r="10" fill="#B8D0F0"/><circle cx="3"  cy="16" r="10" fill="#A8C0E0"/>
            <circle cx="3"  cy="30" r="10" fill="#B8D0F0"/><circle cx="27" cy="32" r="10" fill="#A8C0E0"/>
            <circle cx="14" cy="22" r="12" fill="#D4AF37"/><circle cx="14" cy="22" r="6" fill="#8A6010"/>
        </svg>
        <svg class="floral-corner floral-corner-br" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
            <line x1="14" y1="88" x2="14" y2="42" stroke="#7A8C5A" stroke-width="2.5"/>
            <line x1="14" y1="88" x2="48" y2="88" stroke="#7A8C5A" stroke-width="2.5"/>
            <path d="M14 62 Q0 50 5 36" stroke="#6B7B4A" stroke-width="1.8" fill="none"/>
            <ellipse cx="6" cy="49" rx="13" ry="6" fill="#8A9C5A" transform="rotate(-45 6 49)" opacity="0.9"/>
            <path d="M14 68 Q28 55 42 60" stroke="#6B7B4A" stroke-width="1.8" fill="none"/>
            <ellipse cx="28" cy="62" rx="13" ry="6" fill="#7A8C4A" transform="rotate(20 28 62)" opacity="0.9"/>
            <circle cx="14" cy="26" r="11" fill="#F0D880"/><circle cx="25" cy="16" r="11" fill="#E0C870"/>
            <circle cx="36" cy="14" r="10" fill="#F0D880"/><circle cx="3"  cy="16" r="10" fill="#E0C870"/>
            <circle cx="3"  cy="30" r="10" fill="#F0D880"/><circle cx="27" cy="32" r="10" fill="#E0C870"/>
            <circle cx="14" cy="22" r="12" fill="#D4AF37"/><circle cx="14" cy="22" r="6" fill="#8A6010"/>
        </svg>

        <!-- 黃銅拉桿 -->
        <div class="timeline-slider-container">
            <div class="time-labels">
                <span>年輕的我們（童心）</span>
                <span>現在的我們（在聆聽）</span>
                <span>未來的我們（透著光）</span>
            </div>
            <input type="range" min="0" max="100" value="50" class="brass-slider" id="timeSlider">
        </div>

        <!-- 地圖容器：查理大橋 -->
        <div class="map-hotspots-container">
            <div class="map-hotspots-layer">
                <!-- ① 火藥塔 -->
                <div class="map-node" data-id="1" style="left:35%; top:72%;" title="火藥塔">⚙️</div>
                <!-- ② 哥德尖頂（天文鐘） -->
                <div class="map-node" data-id="2" style="left:45%; top:22%;" title="哥德尖頂">⚙️</div>
                <!-- ③ 舊市政廳 -->
                <div class="map-node" data-id="3" style="left:75%; top:75%;" title="舊市政廳">⚙️</div>
                <!-- ④ 42號電車 -->
                <div class="map-node" data-id="4" style="left:20%; top:40%;" title="42號電車">⚙️</div>
            </div>
        </div>

        <!-- 詩句金句 -->
        <div class="p05-poem-zone" id="poemZone" style="text-align:center; margin:20px 0;">
            <span class="poem-line">叮叮聲響——42 號電車在古城裡搖搖晃晃，</span><br>
            <span class="poem-line">穿過火藥塔的哥德拱門，駛入時光深處。</span><br>
            <span class="poem-line">那是台大醫院、哈佛醫學院畢業名醫粘曉青與鄭惠文，</span><br>
            <span class="poem-line">放下重擔後，在布拉格的叮叮聲裡尋回的純粹。</span>
        </div>

    </div>
</div>

<script>
    /* 007 槍管滑鼠追蹤 */
    const leftPanel = document.getElementById('leftPanel');
    leftPanel.addEventListener('mousemove', (e) => {
        const rect = leftPanel.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        document.getElementById('gunBarrel').style.setProperty('--mouse-x', `${x}%`);
        document.getElementById('gunBarrel').style.setProperty('--mouse-y', `${y}%`);
    });

    /* Web Audio API（純合成，零外部依賴） */
    let _actx = null;
    function actx() {
        if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
        return _actx;
    }
    function playDing() {
        const ctx = actx(), now = ctx.currentTime;
        [554.4, 659.3].forEach((f, i) => {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'sine'; osc.frequency.value = f;
            g.gain.setValueAtTime(0.12, now + i * 0.15);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.3);
            osc.connect(g); g.connect(ctx.destination);
            osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.4);
        });
    }
    function playSax() {
        const ctx = actx(), now = ctx.currentTime;
        [311.1, 349.2, 392.0, 466.2].forEach((f, i) => {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            const flt = ctx.createBiquadFilter();
            osc.type = 'sawtooth'; osc.frequency.value = f;
            flt.type = 'lowpass'; flt.frequency.value = 600;
            g.gain.setValueAtTime(0.2, now + i * 0.12);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.9);
            osc.connect(flt); flt.connect(g); g.connect(ctx.destination);
            osc.start(now + i * 0.12); osc.stop(now + i * 0.12 + 1.0);
        });
    }
    function playMusicBox() {
        const ctx = actx(), now = ctx.currentTime;
        [523.3, 659.3, 784.0, 1046.5].forEach((f, i) => {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'sine'; osc.frequency.value = f;
            g.gain.setValueAtTime(0.12, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
            osc.connect(g); g.connect(ctx.destination);
            osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.5);
        });
    }

    document.addEventListener('click', () => { actx(); }, { once: true });

    /* 詩句動畫 — 逐行淡入 */
    function showPoemLines() {
        const lines = document.querySelectorAll('#poemZone .poem-line');
        lines.forEach((l, i) => {
            setTimeout(() => l.classList.add('fade-in-active'), i * 2000);
        });
    }
    function hidePoemLines() {
        document.querySelectorAll('#poemZone .poem-line')
            .forEach(l => l.classList.remove('fade-in-active'));
    }

    /* 黃銅滑桿互動 */
    const slider  = document.getElementById('timeSlider');
    let hasPlayedLeft = false, hasPlayedRight = false;

    slider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        if (val <= 30) {
            hidePoemLines();
            if (!hasPlayedLeft) { playMusicBox(); hasPlayedLeft = true; hasPlayedRight = false; }
        } else if (val >= 70) {
            if (!hasPlayedRight) { playSax(); showPoemLines(); hasPlayedRight = true; hasPlayedLeft = false; }
        } else {
            hidePoemLines();
            hasPlayedLeft = false; hasPlayedRight = false;
        }
    });

    /* 熱區資料 */
    const spotsData = {
        1: { title: '火藥塔',   img: 'surprise/p05-spot-01.png', play: playDing },
        2: { title: '哥德尖頂', img: 'surprise/p05-spot-02.png', play: playDing },
        3: { title: '舊市政廳', img: 'surprise/p05-spot-03.png', play: playDing },
        4: { title: '42號電車', img: 'surprise/p05-spot-04.png', play: playSax  }
    };

    /* Global Lightbox */
    const lightbox = document.createElement('div');
    lightbox.id = 'global-lightbox';
    lightbox.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:9999;cursor:pointer;';
    lightbox.innerHTML = `
        <div style="position:relative;max-width:85%;max-height:85%;text-align:center;">
            <img id="lightbox-img" src="" alt=""
                 style="max-width:100%;max-height:80vh;border:2px solid #D4AF37;border-radius:6px;box-shadow:0 0 30px rgba(0,0,0,0.6);">
            <h3 id="lightbox-title"
                style="color:#D4AF37;margin-top:12px;font-size:1.2rem;letter-spacing:3px;font-family:sans-serif;"></h3>
            <span style="position:absolute;top:-36px;right:0;color:#fff;font-size:28px;line-height:1;">&times;</span>
        </div>`;
    document.body.appendChild(lightbox);
    lightbox.addEventListener('click', () => { lightbox.style.display = 'none'; });

    /* 熱區點擊 */
    document.querySelectorAll('.map-node').forEach(node => {
        node.addEventListener('click', (e) => {
            e.stopPropagation();
            const data = spotsData[node.dataset.id];
            if (!data) return;
            if (data.play) data.play();
            document.getElementById('lightbox-img').src = data.img;
            document.getElementById('lightbox-title').innerText = data.title;
            lightbox.style.display = 'flex';
        });
    });

    /* 金句 1.5 秒後自動淡入 */
    setTimeout(showPoemLines, 1500);
</script>
</body>
</html>
