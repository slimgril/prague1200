<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P05 - 布拉格紅色電車的火藥塔漫步</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0A0A0A; font-family: sans-serif; }

        .p05-container { display: flex; width: 100%; height: 100%; position: relative; }

        /* 左欄 40%：改成真正的 Before/After 圖片對比（電車 vs 大橋），
           取代原本只是切換濾鏡的假拉桿。兩張圖等高滿版疊在同一個框裡，
           上層（電車）用 clip-path 依拉桿百分比精準裁切露出/遮住，金色
           拉桿貫穿整個對比區域高度、永遠在最上層。 */
        .p05-left-panel {
            width: 40%; height: 100%;
            background-color: #0A0A0A;
            position: relative; overflow: hidden;
        }
        .compare-layer { position: absolute; inset: 0; }
        .hero-image {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
        }
        .compare-layer--before {
            clip-path: inset(0 calc(100% - var(--split, 50%)) 0 0);
            will-change: clip-path;
        }
        /* 垂直金色拉桿：貫穿整個對比區域高度，z-index 最高 */
        .compare-handle {
            position: absolute; top: 0; bottom: 0;
            left: var(--split, 50%);
            width: 3px; margin-left: -1.5px;
            background: linear-gradient(to bottom, #F3D77A, #D4AF37, #8A6D3B);
            box-shadow: 0 0 10px rgba(212,175,55,0.75);
            z-index: 22; pointer-events: none;
        }
        .compare-handle::before {
            content: '⇔';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 34px; height: 34px; border-radius: 50%;
            background: radial-gradient(circle, #FFF, #D4AF37, #8A6D3B);
            border: 2px solid #332211; box-shadow: 0 0 10px rgba(212,175,55,0.8);
            display: flex; align-items: center; justify-content: center;
            color: #332211; font-size: 15px; font-weight: bold;
        }
        /* 拖曳輸入層：鋪滿整個對比區域，看不見但接收拖曳／鍵盤操作，
           這樣在圖片任何地方按住拖曳都能移動拉桿，不必精準點到那條細線 */
        .compare-drag-input {
            position: absolute; inset: 0; width: 100%; height: 100%;
            margin: 0; padding: 0; opacity: 0; cursor: ew-resize;
            -webkit-appearance: none; appearance: none;
            z-index: 23;
        }
        .compare-drag-input::-webkit-slider-thumb { -webkit-appearance: none; width: 100%; height: 100%; }
        .compare-drag-input::-moz-range-thumb { width: 100%; height: 100%; border: none; background: transparent; }
        .compare-caption {
            position: absolute; top: 4%; left: 0; right: 0;
            text-align: center; z-index: 21; pointer-events: none;
            color: #F5E9C9; font-size: 11px; letter-spacing: 0.1em;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            display: flex; justify-content: space-between; padding: 0 6%;
        }

        /* 右欄 60% */
        .p03-right-panel {
            width: 60%; height: 100%;
            background-color: #F4F1EA;
            background-image: linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100% 24px;
            position: relative;
        }

        /* 007 Gun Barrel */
        .gun-barrel-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle 160px at var(--mouse-x, 50%) var(--mouse-y, 50%), transparent 60%, rgba(10,10,10,0.85) 100%);
            opacity: 0; transition: opacity 0.4s ease; pointer-events: none; z-index: 5;
        }
        .p05-left-panel:hover .gun-barrel-overlay { opacity: 1; }

        /* 黃銅拉桿：避開翻頁觸發區 */
        .timeline-slider-container {
            position: absolute; top: 8%; left: 8%;
            width: 66%; text-align: center; z-index: 50;
        }
        .time-labels { display: flex; justify-content: space-between; color: #8A6D3B; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        .brass-slider {
            width: 100%; -webkit-appearance: none;
            background: linear-gradient(to right, #332211, #D4AF37, #332211);
            height: 6px; border-radius: 3px; outline: none; cursor: pointer;
        }
        .brass-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: radial-gradient(circle, #FFF, #D4AF37, #8A6D3B);
            border: 2px solid #332211; box-shadow: 0 0 8px rgba(212,175,55,0.8);
        }

        /* 地圖容器：避開翻頁觸發區，齒輪 tooltip 才不會被擋 */
        .map-hotspots-container {
            position: absolute; top: 22%; left: 6%;
            width: 70%; height: 44%;
            border: 1px solid rgba(138,109,59,0.2); border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background-image: url('surprise/p05_right.png');
            background-size: cover;
            background-position: center center;
            overflow: hidden;
        }
        .map-hotspots-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10; pointer-events: none; }

        /* 金色齒輪熱區 */
        .map-node {
            position: absolute; width: 36px; height: 36px;
            border: 2px solid #D4AF37; background-color: rgba(10,10,10,0.75);
            border-radius: 50%; cursor: pointer; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            color: #D4AF37; font-weight: bold; font-size: 14px;
            box-shadow: 0 0 10px rgba(212,175,55,0.5); transition: all 0.3s ease;
        }
        .map-node:hover { transform: scale(1.2) rotate(45deg); box-shadow: 0 0 15px #D4AF37; background-color: #D4AF37; color: #0A0A0A; }

        /* tooltip 照片 */
        .node-tooltip {
            position: absolute; bottom: 46px; left: 50%;
            transform: translateX(-50%) scale(0.9);
            width: 200px; height: 150px;
            border: 2px solid #D4AF37; border-radius: 6px;
            overflow: hidden; opacity: 0;
            pointer-events: none; transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7); z-index: 100;
        }
        .node-tooltip img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .map-node:hover .node-tooltip { opacity: 1; transform: translateX(-50%) scale(1); }

        /* 拍立得 */
        .p05-polaroid {
            position: absolute; bottom: 4%; right: 6%;
            width: 210px; background: #FFFFFF; padding: 12px 12px 24px 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            transform: rotate(-5deg); transform-origin: bottom right;
            transition: all 0.4s ease; cursor: pointer; z-index: 25;
        }
        .p05-polaroid img { width: 100%; height: auto; display: block; border: 1px solid #EEE; }

        /* 詩句金句 */
        .p05-poem-zone {
            position: absolute; bottom: calc(5% + 40px); left: 8%;
            width: 380px; text-align: left; line-height: 2.3;
            color: #332211; font-weight: 700; font-size: 15px;
            z-index: 40; pointer-events: none;
        }
        .poem-line { display: block; opacity: 0; transform: translateY(6px); transition: opacity 1s ease, transform 1s ease; }
        .poem-line.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<div class="p05-container">

    <!-- 左欄：電車樂園／大橋風景 Before-After 對比 -->
    <div class="p05-left-panel" id="leftPanel">
        <div class="compare-caption" aria-hidden="true"><span>電車樂園</span><span>查理大橋</span></div>
        <div class="compare-layer compare-layer--after">
            <img src="surprise/p05_right.png" class="hero-image" alt="查理大橋風景">
        </div>
        <div class="compare-layer compare-layer--before" id="compareBefore">
            <img src="surprise/p05_base.png" class="hero-image" id="heroImg" alt="布拉格42號古董電車大跨頁">
        </div>
        <div class="compare-handle" id="compareHandle" aria-hidden="true"></div>
        <input type="range" min="0" max="100" value="50" class="compare-drag-input" id="compareDrag"
               aria-label="拖曳比較電車樂園與查理大橋照片">
        <div class="gun-barrel-overlay" id="gunBarrel"></div>
    </div>

    <!-- 右欄：手帳尋寶區 -->
    <div class="p03-right-panel" id="rightPanel">

        <!-- 黃銅拉桿 -->
        <div class="timeline-slider-container">
            <div class="time-labels">
                <span>年輕的我們（童心）</span>
                <span>現在的我們（在聆聽）</span>
                <span>未來的我們（透著光）</span>
            </div>
            <input type="range" min="0" max="100" value="50" class="brass-slider" id="timeSlider">
        </div>

        <!-- 金句詩區 -->
        <div class="p05-poem-zone" id="poemZone">
            <span class="poem-line" id="p05PoemLine1">叮叮聲掠過查理大橋，帶走一整天的疲憊──</span>
            <span class="poem-line" id="p05PoemLine2">那是台大醫院、哈佛醫學院畢業名醫粘曉青與鄭惠文，放下重擔後的城市漫步足跡。</span>
        </div>

        <!-- 地圖容器：火藥塔落日 -->
        <div class="map-hotspots-container">
            <div class="map-hotspots-layer">

                <!-- ① 火藥塔中世紀大拱門 -->
                <div class="map-node" style="left:35%;top:72%;" onclick="triggerLightbox('surprise/p05-spot-01.png',event)">⚙️
                    <div class="node-tooltip"><img src="surprise/p05-spot-01.png" alt="火藥塔"></div>
                </div>

                <!-- ② 哥德式尖頂 -->
                <div class="map-node" style="left:45%;top:22%;" onclick="triggerLightbox('surprise/p05-spot-02.png',event)">⚙️
                    <div class="node-tooltip"><img src="surprise/p05-spot-02.png" alt="哥德尖頂"></div>
                </div>

                <!-- ③ 捷克國家銀行 -->
                <div class="map-node" style="left:75%;top:75%;" onclick="triggerLightbox('surprise/p05-spot-03.png',event)">⚙️
                    <div class="node-tooltip"><img src="surprise/p05-spot-03.png" alt="捷克國家銀行"></div>
                </div>

                <!-- ④ 42號電車漫步手記 -->
                <div class="map-node" style="left:20%;top:40%;" onclick="triggerLightbox('surprise/p05-spot-04.png',event)">⚙️
                    <div class="node-tooltip"><img src="surprise/p05-spot-04.png" alt="42號電車"></div>
                </div>

            </div>
        </div>

        <!-- 拍立得 -->
        <div class="p05-polaroid" id="polaroidPic" onclick="triggerLightbox('surprise/p05_polaroid.png',event)">
            <img src="surprise/p05_polaroid.png" alt="火藥塔漫步拍立得">
        </div>

    </div>
</div>

<script>
    /* 007 槍管滑鼠動態追蹤 */
    const leftPanel = document.getElementById('leftPanel');
    leftPanel.addEventListener('mousemove', (e) => {
        const rect = leftPanel.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        document.getElementById('gunBarrel').style.setProperty('--mouse-x', `${x}%`);
        document.getElementById('gunBarrel').style.setProperty('--mouse-y', `${y}%`);
    });

    /* 逐行淡入：每一行間隔 3 秒，讓讀者讀完這行再出現下一行 */
    let p05PoemRevealed = false;
    let p05PoemTimers = [];
    const p05PoemLineIds = ['p05PoemLine1', 'p05PoemLine2'];
    function revealP05Poem() {
        if (p05PoemRevealed) return;
        p05PoemRevealed = true;
        p05PoemLineIds.forEach((id, i) => {
            p05PoemTimers.push(setTimeout(() => { document.getElementById(id)?.classList.add('show'); }, i * 3000));
        });
    }
    function hideP05Poem() {
        p05PoemRevealed = false;
        p05PoemTimers.forEach(t => clearTimeout(t));
        p05PoemTimers = [];
        p05PoemLineIds.forEach(id => document.getElementById(id)?.classList.remove('show'));
    }

    /* 時光拉桿：現在只負責金句詩區的淡入/淡出，不再連動拍立得或
       電車照片的濾鏡（那些效果跟這顆拉桿的語意無關，之前只是剛好共用
       同一個 input 事件）。 */
    const slider = document.getElementById('timeSlider');
    slider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        if (val >= 70) {
            revealP05Poem();
        } else {
            hideP05Poem();
        }
    });

    /* 真正的 Before/After 對比拉桿：電車樂園（上層） vs 查理大橋（下層）。
       拖曳時用 clip-path 精準裁切上層寬度，金色拉桿與拖曳輸入層都跟著
       同一個 --split 百分比走，滑鼠/觸控/鍵盤（方向鍵）都適用。
       拍立得（.p05-polaroid）刻意不連動這顆拉桿，維持原本亮度與斜貼。 */
    const compareDrag = document.getElementById('compareDrag');
    function setComparePosition(val) {
        leftPanel.style.setProperty('--split', val + '%');
    }
    setComparePosition(compareDrag.value);
    compareDrag.addEventListener('input', (e) => {
        setComparePosition(e.target.value);
    });

    /* Lightbox */
    function triggerLightbox(imgName, e) {
        if (e) e.stopPropagation();
        if (window.parent && window.parent.handleLightbox) {
            window.parent.handleLightbox(imgName);
        }
    }
</script>
</body>
</html>
