<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Prague 1200 · Digital Memory Book · 120 Hours Challenge">
  <title>PRAGUE 1200 · Digital Memory Book</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>📖</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css?v=1600">
  <link rel="stylesheet" href="global.css?v=1600">
</head>
<body>
<div id="app">

  <!-- ── Top bar ── -->
  <header id="top-bar">
    <div class="brand">Prague 1200</div>
    <div class="ctrls">
      <button id="btn-flip"    class="active">📖 翻頁</button>
      <button id="btn-scroll">📜 閱讀</button>
      <button id="btn-archive">🖼 相簿</button>
      <button id="btn-sound"  title="Sound Off">🔇</button>
    </div>
  </header>

  <!-- ── Flipbook view ── -->
  <div id="flipbook-view">
    <div class="book-scene">
      <button class="nav-btn disabled" id="nav-prev">‹</button>
      <button class="nav-btn" id="nav-next">›</button>

      <div id="book">
        <!-- Static left / right backgrounds -->
        <div id="page-left-bg"></div>
        <div id="page-right-bg"></div>

        <!-- Multi-slice flip panel -->
        <div id="flip-wrap"></div>

        <!-- Gradient shadow overlay (peaks at 90°) -->
        <div id="flip-shadow"></div>
      </div>
    </div>
  </div>

  <!-- ── Scroll / Reading view ── -->
  <div id="scroll-view"></div>

  <!-- ── Archive view ── -->
  <div id="archive-view"></div>

  <!-- ── Page indicator ── -->
  <div id="page-indicator">1 / —</div>

</div><!-- #app -->

<!-- Scripts (order matters) -->
<script src="assets/js/sounds.js?v=1600"></script>
<script src="assets/js/flipbook.js?v=1600"></script>
<script src="assets/js/pages_p1_p5.js?v=1600"></script>
<script src="assets/js/pages_p6_p10.js?v=1600"></script>
<script src="assets/js/pages_album.js?v=1600"></script>
<script src="assets/js/archive.js?v=1600"></script>
<script src="assets/js/app.js?v=1600"></script>
</body>
</html>
