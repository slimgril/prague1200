<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="stylesheet" href="global.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P11｜封底・加映片段與尾聲</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Share+Tech+Mono&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: "PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
      display: flex;
    }

    /* =============================================
       浮動蒲公英種子（兩頁共用視覺母題）
       ============================================= */
    .seed-layer {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }
    .seed {
      position: absolute;
      bottom: -20px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 70%, transparent 100%);
      box-shadow: 0 0 4px rgba(255,255,255,0.5);
      opacity: 0;
      animation-name: seedFloat;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @keyframes seedFloat {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      8%   { opacity: 0.9; }
      50%  { transform: translate(var(--drift, 30px), -55vh) rotate(180deg); opacity: 0.75; }
      92%  { opacity: 0.4; }
      100% { transform: translate(calc(var(--drift, 30px) * 2), -105vh) rotate(360deg); opacity: 0; }
    }

    /* =============================================
       左頁：加映片段（豎版影片）
       ============================================= */
    .left-page {
      width: 50%; height: 100%;
      background: #050505;
      background-image: radial-gradient(circle at 50% 40%, rgba(212,175,55,0.07), transparent 60%);
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }

    .left-eyebrow {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.3em;
      color: rgba(212,175,55,0.7);
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      z-index: 4;
    }
    .left-eyebrow.show { opacity: 1; transform: translateY(0); }

    .film-frame {
      position: relative;
      width: 270px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 25px 60px rgba(0,0,0,0.75),
        0 0 0 1px rgba(212,175,55,0.3),
        0 0 42px rgba(212,175,55,0.12);
      opacity: 0;
      transform: scale(0.92) translateY(16px);
      transition: opacity 1.1s ease, transform 1.1s ease;
      z-index: 4;
      cursor: pointer;
    }
    .film-frame.show { opacity: 1; transform: scale(1) translateY(0); }
    .film-frame video {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .film-frame::after {
      content: '';
      position: absolute; inset: 0;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.55);
      pointer-events: none;
    }

    /* =============================================
       播放／暫停鍵：取代原本的黑膠唱片，改用讀者一看就懂的
       標準三角形播放鍵／暫停鍵，放在影片正下方，不會再擋到
       下面的說明文字
       ============================================= */
    .play-control {
      position: relative;
      margin-top: 20px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1s ease, transform 1s ease;
      z-index: 4;
    }
    .play-control.show { opacity: 1; transform: translateY(0); }

    .play-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      background: rgba(10,10,10,0.6);
      color: #d4af37;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 10px rgba(212,175,55,0.25);
    }
    .play-btn:hover { transform: scale(1.08); box-shadow: 0 0 16px rgba(212,175,55,0.5); }
    .play-btn #playIcon { margin-left: 2px; } /* 三角形視覺置中微調 */
    .play-control.playing .play-btn #playIcon { margin-left: 0; }

    .play-hint {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: rgba(212,175,55,0.55);
      transition: opacity 0.4s ease;
    }
    .play-control.playing .play-hint { opacity: 0; }

    .left-caption {
      margin-top: 14px;
      font-family: 'Noto Serif TC', 'PingFang TC', serif;
      font-style: italic;
      font-size: 0.85rem; letter-spacing: 0.05em;
      color: rgba(255,255,255,0.55);
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1s ease, transform 1s ease;
      z-index: 4;
    }
    .left-caption.show { opacity: 1; transform: translateY(0); }

    /* =============================================
       中央分隔線
       ============================================= */
    .divider {
      width: 1px; height: 100%;
      background: linear-gradient(to bottom,
        transparent,
        rgba(212,175,55,0.15) 20%,
        rgba(212,175,55,0.3) 50%,
        rgba(212,175,55,0.15) 80%,
        transparent);
      flex-shrink: 0;
      z-index: 6;
    }

    /* =============================================
       右頁：尾聲金句
       ============================================= */
    .right-page {
      width: 50%; height: 100%;
      background: #faf8f4;
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
      padding: 40px;
      text-align: center;
    }

    .chapter-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem; letter-spacing: 0.3em;
      color: rgba(138,109,59,0.65);
      margin-bottom: 34px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      z-index: 4;
    }
    .chapter-badge.show { opacity: 1; transform: translateY(0); }

    /* 金句節奏：影片播完才出現 → 從遠處放大靠近，停在「正常閱讀尺寸」
       至少 3 秒 → 再放大到約 1.5 倍、停留 5 秒 → 最後用 3 秒慢慢縮回
       正常閱讀尺寸，並且「留在紙面上」不再消失（不是淡出退場，是真的
       印在這一頁上，當作全書的收尾）。 */
    .closing-quote {
      max-width: 380px;
      display: flex; flex-direction: column; gap: 16px;
      z-index: 4;
      opacity: 0;
      transform: scale(0.35);
      transition: opacity 3s ease, transform 3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* 第一階段：從遠處淡入、放大到 1.5 倍（接近讀者），花 3 秒 */
    .closing-quote.appear {
      opacity: 1;
      transform: scale(1.5);
      transition: opacity 3s ease, transform 3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* 第二階段：停留 3 秒後，花 3 秒縮回紙面（正常尺寸 scale(1)） */
    .closing-quote.rest {
      opacity: 1;
      transform: scale(1);
      transition: transform 3s ease;
    }
    .quote-line {
      font-family: 'Noto Serif TC', 'PingFang TC', serif;
      font-size: 1.3rem; line-height: 1.85;
      color: #3a2530;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .quote-line.show { opacity: 1; transform: translateY(0); }
    .quote-line.line2 { color: #c0392b; font-weight: 600; }

    .end-stamp {
      margin-top: 38px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem; letter-spacing: 0.4em;
      padding: 10px 26px;
      border: 2px solid rgba(212,175,55,0.85);
      color: #8a6d3b;
      display: inline-block;
      transform: rotate(-6deg) scale(0.7);
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 4;
    }
    .end-stamp.show {
      opacity: 1; transform: rotate(-6deg) scale(1);
      animation: stampGlow 2.4s ease-in-out 0.6s infinite;
    }
    @keyframes stampGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(212,175,55,0); border-color: rgba(212,175,55,0.7); }
      50%      { box-shadow: 0 0 18px rgba(212,175,55,0.45); border-color: rgba(212,175,55,1); }
    }

    .final-signature {
      position: absolute; bottom: 30px; left: 0; right: 0;
      text-align: center; z-index: 4;
      font-family: 'Caveat', cursive;
      font-size: 1rem; color: rgba(58,37,48,0.5);
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .final-signature.show { opacity: 1; }
    .final-signature .sub {
      display: block;
      margin-top: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      color: rgba(138,109,59,0.5);
    }
  </style>
</head>
<body>

  <!-- 左頁：加映片段 -->
  <div class="left-page">
    <div class="seed-layer" id="seedLayerLeft"></div>

    <div class="left-eyebrow" id="leftEyebrow">▌ BONUS SCENE ／ 加映片段</div>

    <div class="film-frame" id="filmFrame">
      <video id="p11Video" src="surprise/p11.mp4" playsinline preload="auto"></video>
    </div>

    <div class="play-control" id="playControl">
      <button class="play-btn" id="playBtn" type="button" aria-label="播放或暫停加映片段">
        <span id="playIcon">▶</span>
      </button>
      <div class="play-hint" id="playHint">點擊播放加映片段</div>
    </div>

    <div class="left-caption" id="leftCaption">蒲公英飛遠了，<br>願望留在布拉格的風裡。</div>
  </div>

  <!-- 中央分隔線 -->
  <div class="divider"></div>

  <!-- 右頁：尾聲金句 -->
  <div class="right-page">
    <div class="seed-layer" id="seedLayerRight"></div>

    <div class="chapter-badge" id="chapterBadge">▌ PRAGUE 1200 ／ THE END ／ 封底</div>

    <div class="closing-quote">
      <div class="quote-line line1" id="closeLine1">城市會老去，橋會斑駁，</div>
      <div class="quote-line line2" id="closeLine2">而這一頁的笑容，<br>永遠是最新的一張。</div>
    </div>

    <div class="end-stamp" id="endStamp">THE END</div>

    <div class="final-signature" id="finalSignature">
      粘曉青・鄭惠文｜布拉格之春 2024
      <span class="sub">PRAGUE 1200 · FULLY CLOSED</span>
    </div>
  </div>

  <script>
    /* 蒲公英種子飄浮：左右兩頁各自生成，隨機位置/時長，營造貫穿全書的收尾意象 */
    function spawnSeeds(containerId, count) {
      var layer = document.getElementById(containerId);
      if (!layer) return;
      for (var i = 0; i < count; i++) {
        var seed = document.createElement('div');
        seed.className = 'seed';
        var left = Math.random() * 100;
        var drift = (Math.random() * 60 - 30).toFixed(1) + 'px';
        var duration = (9 + Math.random() * 7).toFixed(1) + 's';
        var delay = (Math.random() * 10).toFixed(1) + 's';
        seed.style.left = left + '%';
        seed.style.setProperty('--drift', drift);
        seed.style.animationDuration = duration;
        seed.style.animationDelay = delay;
        layer.appendChild(seed);
      }
    }
    spawnSeeds('seedLayerLeft', 14);
    spawnSeeds('seedLayerRight', 10);

    /* 逐步淡入：左頁字幕 → 相框 → 說明文字，右頁章徽 → 金句 → 印章 → 署名 */
    function seq(steps) {
      steps.forEach(function (s) {
        setTimeout(function () {
          var el = document.getElementById(s.id);
          if (el) el.classList.add('show');
        }, s.at);
      });
    }
    /* 左頁一進來就照原本節奏淡入；右頁的章徽／金句／印章／署名改成
       等影片播完才出現（見下方 runClosingSequence），不再跟左頁搶時間 */
    seq([
      { id: 'leftEyebrow',    at: 300 },
      { id: 'filmFrame',      at: 700 },
      { id: 'playControl',    at: 1500 },
      { id: 'leftCaption',    at: 2100 }
    ]);

    /* 播放鍵：點擊按鈕（或影片本身）→ 播放，圖示變暫停；
       播放完畢 → 圖示歸位成播放鍵，可再次點擊重播；
       同時，影片第一次播完後才觸發右頁金句的「靠近→停留5秒→退回」演出 */
    (function () {
      var video      = document.getElementById('p11Video');
      var control    = document.getElementById('playControl');
      var playBtn    = document.getElementById('playBtn');
      var playIcon   = document.getElementById('playIcon');
      var filmFrame  = document.getElementById('filmFrame');
      if (!video || !control || !playBtn || !playIcon) return;

      function startPlayback() {
        control.classList.add('playing');
        playIcon.textContent = '⏸';
        if (video.ended) { video.currentTime = 0; }
        video.muted = false;
        var p = video.play();
        if (p && p.catch) {
          p.catch(function () {
            // 若瀏覽器阻擋有聲自動播放，改靜音播放（使用者已透過點擊觸發，理論上應允許）
            video.muted = true;
            video.play().catch(function () {});
          });
        }
      }
      function stopPlayback() {
        control.classList.remove('playing');
        playIcon.textContent = '▶';
      }
      function toggle() {
        if (video.paused || video.ended) { startPlayback(); }
        else { video.pause(); stopPlayback(); }
      }

      playBtn.addEventListener('click', toggle);
      if (filmFrame) filmFrame.addEventListener('click', toggle);

      /* 右頁金句演出：章徽淡入 → 金句由遠而近放大到 1.5 倍（3秒） → 停留
         3秒 → 花3秒縮回紙面正常尺寸並「留在紙面上」（不淡出、不消失）→ 印章、署名收尾。
         每次影片播完都會重播一次，並清掉上一輪還沒跑完的計時器，避免使用者反覆重播
         時動畫互相打架 */
      var closingTimers = [];
      function clearClosingTimers() {
        closingTimers.forEach(function (t) { clearTimeout(t); });
        closingTimers = [];
      }
      function after(ms, fn) { closingTimers.push(setTimeout(fn, ms)); }

      var T_APPEAR = 900;           // 開始淡入放大到 1.5 倍
      var D_APPEAR = 3000;          // 淡入放大過渡時間（從小變大到 1.5 倍，3 秒）
      var HOLD_BIG = 3000;          // 1.5 倍狀態停留 3 秒
      var D_REST = 3000;            // 縮回紙面正常尺寸的過渡時間（3秒）

      var T_REST  = T_APPEAR + D_APPEAR + HOLD_BIG;
      var T_STAMP = T_REST + D_REST + 400;
      var T_SIG   = T_STAMP + 800;

      function runClosingSequence() {
        clearClosingTimers();
        var badge = document.getElementById('chapterBadge');
        var quote = document.querySelector('.closing-quote');
        var line1 = document.getElementById('closeLine1');
        var line2 = document.getElementById('closeLine2');
        var stamp = document.getElementById('endStamp');
        var sig   = document.getElementById('finalSignature');
        /* 重播時重置到最初的「遠處、看不見」狀態，才能重新演出一次 */
        if (quote) quote.classList.remove('appear', 'rest');

        after(200, function () { if (badge) badge.classList.add('show'); });
        after(T_APPEAR, function () {
          if (line1) line1.classList.add('show');
          if (line2) line2.classList.add('show');
          if (quote) quote.classList.add('appear');
        });
        after(T_REST, function () {
          if (quote) { quote.classList.remove('appear'); quote.classList.add('rest'); }
        });
        after(T_STAMP, function () { if (stamp) stamp.classList.add('show'); });
        after(T_SIG, function () { if (sig) sig.classList.add('show'); });
      }

      video.addEventListener('ended', function () {
        stopPlayback();
        video.currentTime = 0;
        runClosingSequence();
      });
    })();
  </script>
</body>
</html>
