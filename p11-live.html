<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="stylesheet" href="global.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P11｜封底・加映片段與尾聲</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Share+Tech+Mono&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: "PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
      display: flex;
    }

    /* =============================================
       浮動蒲公英種子（兩頁共用視覺母題）
       ============================================= */
    .seed-layer {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }
    .seed {
      position: absolute;
      bottom: -20px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 70%, transparent 100%);
      box-shadow: 0 0 4px rgba(255,255,255,0.5);
      opacity: 0;
      animation-name: seedFloat;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @keyframes seedFloat {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      8%   { opacity: 0.9; }
      50%  { transform: translate(var(--drift, 30px), -55vh) rotate(180deg); opacity: 0.75; }
      92%  { opacity: 0.4; }
      100% { transform: translate(calc(var(--drift, 30px) * 2), -105vh) rotate(360deg); opacity: 0; }
    }

    /* =============================================
       左頁：加映片段（豎版影片）
       ============================================= */
    .left-page {
      width: 50%; height: 100%;
      background: #050505;
      background-image: radial-gradient(circle at 50% 40%, rgba(212,175,55,0.07), transparent 60%);
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }

    .left-eyebrow {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.3em;
      color: rgba(212,175,55,0.7);
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      z-index: 4;
    }
    .left-eyebrow.show { opacity: 1; transform: translateY(0); }

    .film-frame {
      position: relative;
      width: 270px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 25px 60px rgba(0,0,0,0.75),
        0 0 0 1px rgba(212,175,55,0.3),
        0 0 42px rgba(212,175,55,0.12);
      opacity: 0;
      transform: scale(0.92) translateY(16px);
      transition: opacity 1.1s ease, transform 1.1s ease;
      z-index: 4;
      cursor: pointer;
    }
    .film-frame.show { opacity: 1; transform: scale(1) translateY(0); }
    .film-frame video {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .film-frame::after {
      content: '';
      position: absolute; inset: 0;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.55);
      pointer-events: none;
    }

    /* =============================================
       黑膠唱片啟動機：唱片＋唱臂，點擊播放影片
       ============================================= */
    .vinyl-launcher {
      position: relative;
      width: 150px; height: 96px;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1s ease, transform 1s ease;
      z-index: 4;
    }
    .vinyl-launcher.show { opacity: 1; transform: translateY(0); }

    .vinyl-record {
      position: absolute; left: 6px; top: 12px;
      width: 76px; height: 76px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #d4af37 0 6px, #0a0a0a 7px 9px, transparent 9px),
        repeating-radial-gradient(circle at center, #1c1c1c 0px, #1c1c1c 2px, #0a0a0a 3px, #0a0a0a 4px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.65), 0 0 0 1px rgba(212,175,55,0.25);
      cursor: pointer;
      animation: vinylSpin 2.4s linear infinite;
      animation-play-state: paused;
      transition: transform 0.25s ease;
    }
    .vinyl-record:hover { transform: scale(1.06); }
    .vinyl-record.spinning { animation-play-state: running; }

    .vinyl-play-icon {
      position: absolute; left: 6px; top: 12px;
      width: 76px; height: 76px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.65);
      font-size: 0.8rem;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .vinyl-launcher.playing .vinyl-play-icon { opacity: 0; }

    @keyframes vinylSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .tonearm {
      position: absolute; top: 0; right: 14px;
      width: 4px; height: 54px;
      background: linear-gradient(to bottom, #d4af37, #8a6d3b);
      border-radius: 2px;
      transform-origin: top center;
      transform: rotate(-40deg);
      transition: transform 1.1s cubic-bezier(0.65,0,0.35,1);
      z-index: 6;
    }
    .tonearm::before {
      content: '';
      position: absolute; top: -6px; left: 50%;
      transform: translateX(-50%);
      width: 13px; height: 13px; border-radius: 50%;
      background: #d4af37;
      box-shadow: 0 0 4px rgba(212,175,55,0.6);
    }
    .tonearm::after {
      content: '';
      position: absolute; bottom: -5px; left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 10px; border-radius: 50%;
      background: #111;
      border: 2px solid #d4af37;
    }
    .tonearm.active { transform: rotate(88deg); }

    .vinyl-hint {
      position: absolute; left: 0; bottom: -4px;
      width: 100%;
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: rgba(212,175,55,0.55);
      transition: opacity 0.4s ease;
    }
    .vinyl-launcher.playing .vinyl-hint { opacity: 0; }

    .left-caption {
      margin-top: 14px;
      font-family: 'Noto Serif TC', 'PingFang TC', serif;
      font-style: italic;
      font-size: 0.85rem; letter-spacing: 0.05em;
      color: rgba(255,255,255,0.55);
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1s ease, transform 1s ease;
      z-index: 4;
    }
    .left-caption.show { opacity: 1; transform: translateY(0); }

    /* =============================================
       中央分隔線
       ============================================= */
    .divider {
      width: 1px; height: 100%;
      background: linear-gradient(to bottom,
        transparent,
        rgba(212,175,55,0.15) 20%,
        rgba(212,175,55,0.3) 50%,
        rgba(212,175,55,0.15) 80%,
        transparent);
      flex-shrink: 0;
      z-index: 6;
    }

    /* =============================================
       右頁：尾聲金句
       ============================================= */
    .right-page {
      width: 50%; height: 100%;
      background: #faf8f4;
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
      padding: 40px;
      text-align: center;
    }

    .chapter-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem; letter-spacing: 0.3em;
      color: rgba(138,109,59,0.65);
      margin-bottom: 34px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      z-index: 4;
    }
    .chapter-badge.show { opacity: 1; transform: translateY(0); }

    .closing-quote {
      max-width: 380px;
      display: flex; flex-direction: column; gap: 16px;
      z-index: 4;
    }
    .quote-line {
      font-family: 'Noto Serif TC', 'PingFang TC', serif;
      font-size: 1.3rem; line-height: 1.85;
      color: #3a2530;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .quote-line.show { opacity: 1; transform: translateY(0); }
    .quote-line.line2 { color: #c0392b; font-weight: 600; }

    .end-stamp {
      margin-top: 38px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem; letter-spacing: 0.4em;
      padding: 10px 26px;
      border: 2px solid rgba(212,175,55,0.85);
      color: #8a6d3b;
      display: inline-block;
      transform: rotate(-6deg) scale(0.7);
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 4;
    }
    .end-stamp.show {
      opacity: 1; transform: rotate(-6deg) scale(1);
      animation: stampGlow 2.4s ease-in-out 0.6s infinite;
    }
    @keyframes stampGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(212,175,55,0); border-color: rgba(212,175,55,0.7); }
      50%      { box-shadow: 0 0 18px rgba(212,175,55,0.45); border-color: rgba(212,175,55,1); }
    }

    .final-signature {
      position: absolute; bottom: 30px; left: 0; right: 0;
      text-align: center; z-index: 4;
      font-family: 'Caveat', cursive;
      font-size: 1rem; color: rgba(58,37,48,0.5);
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .final-signature.show { opacity: 1; }
    .final-signature .sub {
      display: block;
      margin-top: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      color: rgba(138,109,59,0.5);
    }
  </style>
</head>
<body>

  <!-- 左頁：加映片段 -->
  <div class="left-page">
    <div class="seed-layer" id="seedLayerLeft"></div>

    <div class="left-eyebrow" id="leftEyebrow">▌ BONUS SCENE ／ 加映片段</div>

    <div class="film-frame" id="filmFrame">
      <video id="p11Video" src="surprise/p11.mp4" playsinline preload="auto"></video>
    </div>

    <div class="vinyl-launcher" id="vinylLauncher">
      <div class="tonearm" id="tonearm"></div>
      <div class="vinyl-record" id="vinylRecord"></div>
      <div class="vinyl-play-icon" id="vinylPlayIcon">▶</div>
      <div class="vinyl-hint" id="vinylHint">點擊唱片，播放加映片段</div>
    </div>

    <div class="left-caption" id="leftCaption">蒲公英飛遠了，<br>願望留在布拉格的風裡。</div>
  </div>

  <!-- 中央分隔線 -->
  <div class="divider"></div>

  <!-- 右頁：尾聲金句 -->
  <div class="right-page">
    <div class="seed-layer" id="seedLayerRight"></div>

    <div class="chapter-badge" id="chapterBadge">▌ PRAGUE 1200 ／ THE END ／ 封底</div>

    <div class="closing-quote">
      <div class="quote-line line1" id="closeLine1">城市會老去，橋會斑駁，</div>
      <div class="quote-line line2" id="closeLine2">而這一頁的笑容，<br>永遠是最新的一張。</div>
    </div>

    <div class="end-stamp" id="endStamp">THE END</div>

    <div class="final-signature" id="finalSignature">
      粘曉青・鄭惠文｜布拉格之春 2024
      <span class="sub">PRAGUE 1200 · FULLY CLOSED</span>
    </div>
  </div>

  <script>
    /* 蒲公英種子飄浮：左右兩頁各自生成，隨機位置/時長，營造貫穿全書的收尾意象 */
    function spawnSeeds(containerId, count) {
      var layer = document.getElementById(containerId);
      if (!layer) return;
      for (var i = 0; i < count; i++) {
        var seed = document.createElement('div');
        seed.className = 'seed';
        var left = Math.random() * 100;
        var drift = (Math.random() * 60 - 30).toFixed(1) + 'px';
        var duration = (9 + Math.random() * 7).toFixed(1) + 's';
        var delay = (Math.random() * 10).toFixed(1) + 's';
        seed.style.left = left + '%';
        seed.style.setProperty('--drift', drift);
        seed.style.animationDuration = duration;
        seed.style.animationDelay = delay;
        layer.appendChild(seed);
      }
    }
    spawnSeeds('seedLayerLeft', 14);
    spawnSeeds('seedLayerRight', 10);

    /* 逐步淡入：左頁字幕 → 相框 → 說明文字，右頁章徽 → 金句 → 印章 → 署名 */
    function seq(steps) {
      steps.forEach(function (s) {
        setTimeout(function () {
          var el = document.getElementById(s.id);
          if (el) el.classList.add('show');
        }, s.at);
      });
    }
    seq([
      { id: 'leftEyebrow',    at: 300 },
      { id: 'filmFrame',      at: 700 },
      { id: 'vinylLauncher',  at: 1500 },
      { id: 'leftCaption',    at: 2100 },
      { id: 'chapterBadge',   at: 400 },
      { id: 'closeLine1',     at: 1200 },
      { id: 'closeLine2',     at: 3200 },
      { id: 'endStamp',       at: 4600 },
      { id: 'finalSignature', at: 5400 }
    ]);

    /* 黑膠唱片啟動機：點擊唱片（或影片本身）→ 唱針落下、唱片轉動、影片播放；
       播放完畢 → 唱針歸位、唱片停轉，可再次點擊重播 */
    (function () {
      var video    = document.getElementById('p11Video');
      var launcher = document.getElementById('vinylLauncher');
      var record   = document.getElementById('vinylRecord');
      var tonearm  = document.getElementById('tonearm');
      var filmFrame = document.getElementById('filmFrame');
      if (!video || !launcher || !record || !tonearm) return;

      function startPlayback() {
        record.classList.add('spinning');
        tonearm.classList.add('active');
        launcher.classList.add('playing');
        if (video.ended) { video.currentTime = 0; }
        video.muted = false;
        var p = video.play();
        if (p && p.catch) {
          p.catch(function () {
            // 若瀏覽器阻擋有聲自動播放，改靜音播放（使用者已透過點擊觸發，理論上應允許）
            video.muted = true;
            video.play().catch(function () {});
          });
        }
      }
      function stopPlayback() {
        record.classList.remove('spinning');
        tonearm.classList.remove('active');
        launcher.classList.remove('playing');
      }
      function toggle() {
        if (video.paused || video.ended) { startPlayback(); }
        else { video.pause(); stopPlayback(); }
      }

      record.addEventListener('click', toggle);
      if (filmFrame) filmFrame.addEventListener('click', toggle);
      video.addEventListener('ended', function () {
        stopPlayback();
        video.currentTime = 0;
      });
    })();
  </script>
</body>
</html>
