<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="stylesheet" href="global.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P10｜Prague 1200 終章・馬拉松終點</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: "PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
      display: flex;
    }

    /* =============================================
       左頁：極黑・馬拉松雙計時器
       ============================================= */
    .left-page {
      width: 50%; height: 100%;
      background: #050505;
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* 剪影照片 */
    .silhouette-photo {
      position: absolute; inset: 0;
      background: url('surprise/p10-silhouette.jpg') center/cover no-repeat;
      opacity: 0.28; filter: brightness(0.4) contrast(1.2);
    }

    /* 左頁內容 */
    .left-content {
      position: relative; z-index: 2;
      text-align: center; padding: 40px;
      width: 100%;
    }

    /* 章節標記 */
    .chapter-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.35em;
      color: rgba(255,140,0,0.6); margin-bottom: 18px;
    }

    /* 終點線橫幅 */
    .finish-banner {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem; letter-spacing: 0.3em;
      color: rgba(255,255,255,0.55);
      margin-bottom: 30px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .finish-banner .flag { font-size: 1rem; }
    .finish-banner .track-line {
      flex: 1; max-width: 60px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,140,0,0.5));
    }
    .finish-banner .track-line.right {
      background: linear-gradient(to left, transparent, rgba(255,140,0,0.5));
    }

    /* 播放鍵：整個計時動畫（天數、公里數、步數、右側照片輪播、配樂）
       一律等讀者按下這顆鍵才開始，翻頁翻到這一頁時全部保持靜止不動——
       這樣不管正翻反翻，音樂能不能播全靠這顆鍵的真人點擊來觸發，
       不會再有「瀏覽器自動播放規則」猜不準的問題。 */
    .play-trigger {
      width: 62px; height: 62px;
      border-radius: 50%;
      border: 2px solid #ff8c00;
      background: rgba(10,10,10,0.55);
      color: #ff8c00;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.35rem;
      cursor: pointer;
      margin: 0 auto 22px;
      box-shadow: 0 0 16px rgba(255,140,0,0.35);
      transition: opacity 0.4s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .play-trigger:hover { transform: scale(1.08); box-shadow: 0 0 22px rgba(255,140,0,0.55); }
    .play-trigger #p10PlayIcon { margin-left: 3px; }
    .play-trigger.hidden { opacity: 0; pointer-events: none; transform: scale(0.85); }
    .play-hint {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.58rem; letter-spacing: 0.15em;
      color: rgba(255,140,0,0.55);
      margin-bottom: 22px;
      transition: opacity 0.4s ease;
    }
    .play-hint.hidden { opacity: 0; height: 0; margin: 0; overflow: hidden; }

    /* 目前第幾天：放在左頁最上方，字體放大約3倍，並持續呼吸感動畫 */
    .day-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2.5rem; letter-spacing: 0.15em;
      color: #ff8c00;
      text-shadow: 0 0 20px rgba(255,140,0,0.55), 0 0 40px rgba(255,140,0,0.25);
      margin-bottom: 26px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .day-label.show {
      opacity: 1; transform: translateY(0);
      animation: dayBreathe 2.6s ease-in-out 0.5s infinite;
    }
    @keyframes dayBreathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.7; transform: scale(1.07); }
    }

    /* 雙計時器 */
    .dual-counter {
      display: flex; flex-direction: column; gap: 26px;
      margin: 0 auto 26px;
    }
    .counter-row {
      display: flex; align-items: baseline;
      justify-content: center; gap: 12px;
    }
    .counter-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.2em;
      color: rgba(255,255,255,0.35);
      text-align: right; min-width: 100px;
    }
    .counter-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2.6rem; font-weight: 400;
      color: #ff8c00;
      text-shadow: 0 0 20px rgba(255,140,0,0.6),
                   0 0 40px rgba(255,140,0,0.3);
      letter-spacing: 0.03em;
      min-width: 190px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .counter-unit {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem; color: rgba(255,140,0,0.5);
      min-width: 60px; text-align: left;
    }

    /* 進度軌道 */
    .progress-track {
      width: 260px; height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      margin: 4px auto 28px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(to right, #ff8c00, #ffb347);
      box-shadow: 0 0 10px rgba(255,140,0,0.6);
      transition: width 0.05s linear;
    }

    /* 完賽狀態 */
    .status-line {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem; letter-spacing: 0.25em;
      padding: 10px 24px;
      border: 1px solid rgba(255,140,0,0.4);
      color: #ff8c00;
      display: inline-block;
    }
    .status-line.running { animation: statusBlink 2s infinite; }
    .status-line.finished {
      border-color: #ff8c00;
      color: #fff;
      background: rgba(255,140,0,0.15);
      box-shadow: 0 0 18px rgba(255,140,0,0.5);
    }
    @keyframes statusBlink {
      0%, 100% { border-color: rgba(255,140,0,0.4); }
      50% { border-color: rgba(255,140,0,0.9); box-shadow: 0 0 12px rgba(255,140,0,0.3); }
    }

    /* 彩花 */
    .confetti-layer {
      position: absolute; inset: 0; z-index: 3;
      pointer-events: none; overflow: hidden;
    }
    .confetti-piece {
      position: absolute; top: -20px;
      width: 8px; height: 14px;
      opacity: 0.95;
      animation-name: confettiFall;
      animation-timing-function: cubic-bezier(0.4, 0.1, 0.6, 0.9);
      animation-fill-mode: forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120vh) rotate(540deg); opacity: 0; }
    }

    /* 左下角醫師署名 */
    .left-signature {
      position: absolute; bottom: 32px; left: 0; right: 0;
      text-align: center; z-index: 2;
      font-family: 'Caveat', cursive;
      font-size: 0.9rem; color: rgba(255,255,255,0.3);
      letter-spacing: 0.1em;
    }

    /* =============================================
       中央分隔線
       ============================================= */
    .divider {
      width: 1px; height: 100%;
      background: linear-gradient(to bottom,
        transparent,
        rgba(255,140,0,0.15) 20%,
        rgba(255,140,0,0.3) 50%,
        rgba(255,140,0,0.15) 80%,
        transparent);
      flex-shrink: 0;
    }

    /* =============================================
       右頁：回顧輪播 ＋ 終章金句
       ============================================= */
    .right-page {
      width: 50%; height: 100%;
      background: #faf8f4;
      position: relative;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* 上半：照片輪播 */
    .photo-carousel {
      position: relative;
      width: 100%; height: 58%;
      overflow: hidden;
      background: #111;
    }
    .photo-carousel img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    .photo-carousel img.active { opacity: 1; }
    .photo-carousel::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 65%, rgba(250,248,244,1) 100%);
      pointer-events: none;
    }

    /* 下半：終章金句 */
    .finale-quote {
      flex: 1;
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 30px 130px 30px 40px;
      text-align: center;
      gap: 18px;
    }
    .quote-line {
      font-family: 'Noto Serif TC', 'PingFang TC', serif;
      font-size: 1.3rem; line-height: 1.8;
      color: #3a2530;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .quote-line.show { opacity: 1; transform: translateY(0); }
    .quote-line.line2 {
      color: #c0392b;
      font-weight: 600;
    }

    /* 五天門票／參觀券合影：斜放小照片，填補右下角空白 */
    .ticket-photo {
      position: absolute;
      bottom: 22px; right: 22px;
      width: 108px;
      background: #fff;
      padding: 6px 6px 16px;
      box-shadow: 0 12px 26px rgba(0,0,0,0.28);
      transform: rotate(-9deg) translateY(14px);
      opacity: 0;
      transition: opacity 1.1s ease, transform 1.1s ease;
    }
    .ticket-photo.show { opacity: 1; transform: rotate(-9deg) translateY(0); }
    .ticket-photo img {
      width: 100%; display: block;
      filter: saturate(0.92);
    }
    .ticket-photo .cap {
      font-family: 'Caveat', cursive;
      font-size: 0.72rem; color: #6b5a4a;
      text-align: center; margin-top: 4px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <!-- 左頁：極黑・馬拉松雙計時器 -->
  <div class="left-page">
    <div class="silhouette-photo"></div>
    <div class="confetti-layer" id="confettiLayer"></div>

    <div class="left-content">
      <button class="play-trigger" id="p10PlayBtn" type="button" aria-label="開始播放馬拉松計時動畫與配樂">
        <span id="p10PlayIcon">▶</span>
      </button>
      <div class="play-hint" id="p10PlayHint">點擊播放本頁動畫與配樂</div>

      <div class="day-label" id="dayLabel">第 1 天</div>

      <div class="chapter-badge">▌ PRAGUE 1200 ／ FINAL CHAPTER ／ P10</div>

      <div class="finish-banner">
        <span class="track-line"></span>
        <span class="flag">🏁</span>
        <span>MARATHON FINISH LINE</span>
        <span class="flag">🏁</span>
        <span class="track-line right"></span>
      </div>

      <div class="dual-counter">
        <div class="counter-row">
          <span class="counter-label">DISTANCE</span>
          <span class="counter-value" id="kmValue">0.0</span>
          <span class="counter-unit">km</span>
        </div>
        <div class="counter-row">
          <span class="counter-label">STEPS</span>
          <span class="counter-value" id="stepsValue">0</span>
          <span class="counter-unit">steps</span>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="status-line" id="statusLine"></div>
    </div>

    <div class="left-signature">
      粘曉青・鄭惠文｜布拉格之春 2024
    </div>
  </div>

  <!-- 中央分隔線 -->
  <div class="divider"></div>

  <!-- 右頁：回顧輪播 ＋ 終章金句 -->
  <div class="right-page">

    <div class="photo-carousel" id="photoCarousel">
      <img src="surprise/電車樂園.png" alt="電車樂園" class="active">
      <img src="surprise/天文鐘.JPG" alt="天文鐘">
      <img src="surprise/p08-exterior.jpg" alt="聖維特教堂">
      <img src="surprise/卡羅維瓦利.png" alt="普普飯店">
      <img src="surprise/p09-bridge.jpg" alt="CK城堡">
      <img src="surprise/222222.png" alt="查理大橋">
      <img src="surprise/11111.png" alt="布拉格之春">
      <img src="surprise/image_Ex9PZd.png" alt="皇家之路石階">
      <img src="surprise/image_fUPCtw.png" alt="老城橋塔">
      <img src="surprise/image_fR_FA9.png" alt="小城區石板路">
      <img src="surprise/image_9KIY5C.png" alt="查理大橋聖人雕像">
      <img src="surprise/image_7jQQNK.png" alt="城堡山特寫">
      <img src="surprise/image_oxeP6p.png" alt="火藥塔夕照">
    </div>

    <div class="finale-quote">
      <div class="quote-line line1" id="quoteLine1">布拉格之春馬拉松之旅的終章，</div>
      <div class="quote-line line2" id="quoteLine2">卻是人生下階段的再起。</div>
      <div class="ticket-photo" id="ticketPhoto">
        <img src="surprise/pass.png" alt="五天參觀券與門票">
        <div class="cap">5 days ・ every ticket kept</div>
      </div>
    </div>

  </div>

  <script>
    /* ============================================================
       馬拉松雙計時器：公里數 ＋ 步數，同步從 0 開始，
       以 100 公尺為單位慢慢跳，跳到每天里程碑停 2.5 秒再繼續，
       跳到第 5 天 52.5 公里／82,500 步時停住，彈彩花＋跳金句。

       改版重點：不管正翻反翻進到這一頁，一律先保持完全靜止
       （天數、公里數、步數、右側照片輪播、配樂全部不動），
       等讀者親手按下左邊那顆播放鍵才開始——瀏覽器自動播放規則
       只認「真人手勢」，用按鍵直接觸發就不會再有「正翻沒聲音、
       反翻才有聲音」這種猜不準的問題，兩個方向都要按鍵才會動，
       完全對稱。
       ============================================================ */
    (function () {
      var TICK_MS = 70;   // 整體再慢一倍，讓右邊照片輪播來得及跑完
      var PAUSE_MS = 5000;
      var TICKS_PER_DAY = 105;      // 10.5km / 0.1km
      var TOTAL_TICKS = TICKS_PER_DAY * 5; // 525 → 52.5km
      var STEPS_PER_KM = 82500 / 52.5;     // 1571.428571...

      var ticks = 0;
      var timer = null;
      var dayAdvanceTimer = null;

      var $day = document.getElementById('dayLabel');
      var $km = document.getElementById('kmValue');
      var $steps = document.getElementById('stepsValue');
      var $fill = document.getElementById('progressFill');
      var $status = document.getElementById('statusLine');
      var $playBtn = document.getElementById('p10PlayBtn');
      var $playHint = document.getElementById('p10PlayHint');

      function updateDisplay() {
        var km = ticks / 10;
        var steps = Math.round(km * STEPS_PER_KM);
        $km.textContent = km.toFixed(1);
        $steps.textContent = steps.toLocaleString('en-US');
        $fill.style.width = (ticks / TOTAL_TICKS * 100) + '%';
      }

      function showDay(n) {
        $day.classList.remove('show');
        setTimeout(function () {
          $day.textContent = '第 ' + n + ' 天';
          $day.classList.add('show');
        }, 120);
      }

      function tick() {
        ticks++;
        updateDisplay();

        if (ticks % TICKS_PER_DAY === 0) {
          clearInterval(timer);
          if (ticks >= TOTAL_TICKS) {
            onFinish();
          } else {
            dayAdvanceTimer = setTimeout(function () {
              showDay(ticks / TICKS_PER_DAY + 1);
              timer = setInterval(tick, TICK_MS);
            }, PAUSE_MS);
          }
        }
      }

      function spawnConfetti() {
        var layer = document.getElementById('confettiLayer');
        var colors = ['#ff8c00', '#ffb347', '#ffffff', '#ff5555', '#ffd166'];
        for (var i = 0; i < 40; i++) {
          (function () {
            var piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = (Math.random() * 100) + '%';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
            piece.style.animationDelay = (Math.random() * 0.6) + 's';
            layer.appendChild(piece);
            setTimeout(function () { piece.remove(); }, 5000);
          })();
        }
      }

      /* 播完第 5 天：計時器、右側照片輪播、配樂全部一起停下來 */
      function onFinish() {
        $status.textContent = '🏁 PROJECT STATUS : COMPLETED';
        $status.classList.remove('running');
        $status.classList.add('finished');
        spawnConfetti();
        window.dispatchEvent(new CustomEvent('p10:stop'));

        setTimeout(function () {
          document.getElementById('quoteLine1').classList.add('show');
          document.getElementById('ticketPhoto').classList.add('show');
        }, 400);
        setTimeout(function () {
          document.getElementById('quoteLine2').classList.add('show');
        }, 2400);
      }

      function start() {
        showDay(1);
        $status.textContent = '▶ PROJECT STATUS : IN PROGRESS';
        $status.classList.add('running');
        timer = setInterval(tick, TICK_MS);
      }

      /* 離頁／進頁重置：整個停下來、歸零，並讓播放鍵重新出現，
         下次不管正翻反翻進到這一頁，都是同一個「按下去才開始」的狀態。 */
      function resetAll() {
        clearInterval(timer);
        clearTimeout(dayAdvanceTimer);
        ticks = 0;
        updateDisplay();
        $day.classList.remove('show');
        $day.textContent = '第 1 天';
        $status.textContent = '';
        $status.classList.remove('finished');
        $status.classList.remove('running');
        document.getElementById('quoteLine1')?.classList.remove('show');
        document.getElementById('quoteLine2')?.classList.remove('show');
        document.getElementById('ticketPhoto')?.classList.remove('show');
        var layer = document.getElementById('confettiLayer');
        if (layer) layer.innerHTML = '';
        $playBtn?.classList.remove('hidden');
        $playHint?.classList.remove('hidden');
        window.dispatchEvent(new CustomEvent('p10:stop'));
      }

      /* 按下播放鍵：真人點擊，同步觸發計時器＋（透過 p10:play 事件）
         右側照片輪播與配樂，三者一起開始，瀏覽器不會擋。 */
      function handlePlayClick() {
        $playBtn.classList.add('hidden');
        $playHint.classList.add('hidden');
        start();
        window.dispatchEvent(new CustomEvent('p10:play'));
      }
      $playBtn?.addEventListener('click', handlePlayClick);

      /* 進頁／離頁一律重置成「靜止、等待按鍵」的狀態，不再自動開始
         任何動畫或配樂。 */
      window.__onSpreadActivated = function () {
        resetAll();
      };
      window.__onSpreadDeactivated = function () {
        resetAll();
      };
    })();

    /* ============================================================
       右頁照片輪播：跟左邊播放鍵同步——沒按播放鍵之前完全靜止，
       停在第一張；按下播放鍵（p10:play）才開始循環播放；
       計時器跑完或離開頁面（p10:stop）就停在當下那一張。
       ============================================================ */
    (function () {
      var imgs = document.querySelectorAll('#photoCarousel img');
      if (!imgs.length) return;
      var idx = 0;
      var carouselTimer = null;

      function startCarousel() {
        if (carouselTimer) return;
        carouselTimer = setInterval(function () {
          imgs[idx].classList.remove('active');
          idx = (idx + 1) % imgs.length;
          imgs[idx].classList.add('active');
        }, 3800);
      }
      function stopCarousel() {
        clearInterval(carouselTimer);
        carouselTimer = null;
      }
      function resetCarousel() {
        stopCarousel();
        imgs.forEach(function (img, i) { img.classList.toggle('active', i === 0); });
        idx = 0;
      }

      window.addEventListener('p10:play', startCarousel);
      window.addEventListener('p10:stop', function () {
        stopCarousel();
      });
      resetCarousel();
    })();
  </script>

  <script>
    /* 本頁配樂：不再嘗試「翻頁翻到就自動播放」（這是瀏覽器自動播放規則
       猜不準、正翻反翻不對稱的根源），改成完全跟左邊播放鍵綁在一起——
       讀者按下播放鍵（p10:play）這個真實的手勢，才觸發配樂淡入；
       計時器跑完或離開頁面（p10:stop）就淡出。這樣不管正翻反翻，
       只要讀者按鍵，聲音一定會出來，行為完全對稱、可預期。 */
    (function () {
      function fadeIn() {
        try { parent.SoundEngine?.fadeInTrack?.('surprise/p10-theme.mp3', { volume: 0.7, fadeMs: 2500, loop: true }); } catch (e) {}
      }
      function fadeOut() {
        try { parent.SoundEngine?.fadeOutTrack?.({ fadeMs: 2000 }); } catch (e) {}
      }

      window.addEventListener('p10:play', fadeIn);
      window.addEventListener('p10:stop', fadeOut);

      /* 保底：右上角喇叭鈕（flipbook.js 的 kickSound()）也能直接
         強制重新淡入一次配樂，多一層保險。 */
      window.__onSoundKick = fadeIn;

      window.addEventListener('pagehide', fadeOut);
      window.addEventListener('beforeunload', fadeOut);
    })();
  </script>
</body>
</html>
