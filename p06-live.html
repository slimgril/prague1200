<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P06｜布拉格之春的迴旋：舊城、橋影與深夜金光</title>
  <style>
    body {
      margin: 0;
      background: #050505;
      font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
      overflow-x: hidden;
    }

    /* 電影視窗：position:relative 讓固定字幕能定位；perspective 是整個 3D
       場景「攝影機離畫面多近」的關鍵值——數值越小、離得越近，轉動時的
       放大縮小／位移幅度就越明顯，立體感越強。固定用 1500px（不再依容器
       寬度動態換算），確保是真正「靠近觀眾」的攝影機視角，而不是先前
       那種為了讓一圈 12 面剛好貼滿畫面寬度、半徑被迫拉到 2000px 以上，
       透視值也只好跟著放大到快 8500px 的「幾乎正交投影」——那樣數學上
       是 3D，但視覺上跟平面沒兩樣。 */
    .cinema-window {
      width: 100%;
      height: 540px;
      overflow: hidden;
      position: relative;
      background: #000;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.95);
      margin: 40px 0;
      perspective: 1500px;
    }

    /* =============================================
       遠景背景：三張大圖交叉淡入淡出，「固定不跟著圓筒轉」，
       只用 translateZ(-200px) scale(1.4) 往後退、放大鋪滿，
       跟前景懸浮旋轉的照片之間拉開明顯的距離——這才是畫面「有沒有
       深度」的關鍵：不是背景本身要不要轉，而是背景跟前景「是不是在
       不同的距離上」。原本背景也切成 12 面貼在跟照片同一個半徑上，
       兩者永遠等距、轉動時完全沒有前後視差，看起來就是整片貼皮的
       牆面在轉，而不是有縱深的空間。 */
    .backdrop-slice {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center;
      opacity: 0;
      transform: translateZ(-200px) scale(1.4);
      transform-style: preserve-3d;
    }
    .backdrop-slice.slice-left  { background-image: url('surprise/image_oxeP6p.png');  filter: brightness(0.55) contrast(1.05); animation: bgLeft  28s linear infinite; }
    .backdrop-slice.slice-mid   { background-image: url('surprise/image_111llO.png');  filter: brightness(0.5)  contrast(1.1);  animation: bgMid   28s linear infinite; }
    .backdrop-slice.slice-right { background-image: url('surprise/image_9KIY5C.png');  filter: brightness(0.3)  contrast(1.15); animation: bgRight 28s linear infinite; }

    /* 跟字幕完全同一組時間切點（0~30% / 35~68% / 72~98%），背景換場、
       字幕出現同步發生，視覺上像「場景真的換了」而不是各轉各的。 */
    @keyframes bgLeft   { 0%, 30%, 100% { opacity: 0; } 5%, 25%   { opacity: 1; } }
    @keyframes bgMid    { 0%, 35%, 68%, 100% { opacity: 0; } 40%, 63% { opacity: 1; } }
    @keyframes bgRight  { 0%, 72%, 98% { opacity: 0; } 77%, 93%   { opacity: 1; } }

    .backdrop-vignette {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(5,5,5,0.85) 0%, transparent 14%, transparent 86%, rgba(5,5,5,0.85) 100%);
      pointer-events: none;
    }

    /* 360 度旋轉圓筒：現在「只承載懸浮照片」，不再背著整片背景牆一起轉。
       每張照片各自在自己的 rotateY(角度) 上用 translateZ(450px) 懸浮在
       一個比背景近得多的距離，跟着圓筒整體慢慢環繞——離攝影機近、
       transform 幅度大，轉動時看得出明顯的靠近／遠離／左右穿梭，這才是
       「立體圓筒」該有的樣子。 */
    .carousel-3d {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      transform-style: preserve-3d;
      animation: carouselSpin 28s linear infinite;
      will-change: transform;
    }

    .cinema-window:hover .carousel-3d {
      animation-play-state: paused;
    }

    @keyframes carouselSpin {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(-360deg); }
    }

    .music-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 40%, rgba(212,175,55,0.06) 70%, transparent 100%);
      pointer-events: none;
      z-index: 5;
      transform: rotateY(120deg) translateZ(450px);
    }

    /* 照片卡片：不再用 top/left 平鋪定位，改成「各自獨立的 rotateY(角度) +
       translateZ(450px)」懸浮環繞圓筒——同一段敘事（老城／天文鐘／查理
       大橋）裡的照片彼此角度略有差異，環繞時才有前後穿梭的層次，而不是
       死死貼在同一片牆上。translateX(-50%) 先把卡片自己的版面置中，
       後面接的 rotate(傾角) 是原本「拍立得微微歪一點」的效果，順序放在
       translateZ／rotateY 之前，代表是卡片自己平面內的旋轉，不影響它在
       圓筒上的環繞位置。 */
    .photo-card {
      position: absolute;
      left: 50%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.65);
      border-radius: 4px;
      overflow: hidden;
    }
    .photo-card img { width: 100%; height: auto; display: block; }

    .edge-vignette {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 65%, rgba(5,5,5,0.45) 100%);
      pointer-events: none;
    }

    .b-size { width: 310px; margin-left: -155px; border-radius: 6px; z-index: 10; }
    .c-size { width: 210px; margin-left: -105px; border-radius: 4px; z-index: 12; border: 2px solid rgba(255,255,255,0.85); }
    .d-size { width: 125px; margin-left: -62.5px; border-radius: 2px; z-index: 15; opacity: 0.78; }

    /* 第一段：老城街道、城堡塔（圍繞在 -30°~+20° 附近） */
    /* 修正：3D 定位改成「先 rotateY 轉到角度、再 translateZ 推出半徑」（原本
       順序相反，導致全部照片被推到同一點，疊成一直條）；水平置中改用
       margin-left（固定像素），不再跟 rotateY 混在同一串 transform 裡被
       帶著偏移。 */
    #photo-oldtown-street       { top: 4%;  width: 150px; margin-left: -75px; transform: rotateY(-24deg) translateZ(450px) rotate(-1.5deg); }
    #photo-castle-tower         { top: 10%;               transform: rotateY(18deg)  translateZ(450px) rotate(2deg); }

    /* 第二段：天文鐘樓群像（圍繞在 100°~145° 附近） */
    #photo-clocktower           { top: 16%;               transform: rotateY(100deg) translateZ(450px) rotate(-2deg); }
    #photo-dr-closeup           { top: 6%;  z-index: 14;  transform: rotateY(114deg) translateZ(450px) rotate(3deg); }
    #photo-janhus               { top: 44%;               transform: rotateY(130deg) translateZ(450px) rotate(-3deg); }
    #fragment-clock-death       { top: 68%; filter: blur(0.3px); transform: rotateY(106deg) translateZ(450px) rotate(-8deg); }
    #fragment-apostles-mechanism{ top: 12%;               transform: rotateY(142deg) translateZ(450px) rotate(6deg); }

    /* 第三段：查理大橋橋塔（圍繞在 218°~258° 附近） */
    #photo-bridgetower          { top: 5%;  width: 320px; margin-left: -160px; z-index: 10; filter: hue-rotate(35deg) brightness(0.32) contrast(1.15); transform: rotateY(220deg) translateZ(450px); }
    #photo-bridge-statue        { top: 8%;  width: 175px; margin-left: -87.5px; transform: rotateY(256deg) translateZ(450px) rotate(-1deg); }

    /* =====================================================
       字幕層：移出 panorama-rail，固定在 cinema-window 上
       ===================================================== */
    .subtitle-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    .movie-subtitle {
      position: absolute;
      width: 60%;
      left: 20%;
      color: rgba(255,255,255,0.95);
      font-size: 1.15rem; line-height: 1.8; letter-spacing: 0.15em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.95);
      text-align: center;
      opacity: 0;
    }
    .magenta-text { color: #ff007f; font-weight: 500; }
    .movie-caption { font-size: 1.35rem; font-weight: bold; letter-spacing: 0.05em; margin-bottom: 6px; }

    /* 三段字幕垂直位置（固定在視窗黃金比例） */
    .subtitle-left  { top: 42%; animation: subtitleLeft  28s linear infinite; }
    .subtitle-mid   { top: 38%; animation: subtitleMid   28s linear infinite; }
    .subtitle-right { top: 45%; animation: subtitleRight 28s linear infinite; }

    /* 左段 */
    @keyframes subtitleLeft {
      0%, 30%, 100% { opacity: 0; transform: translateY(10px); }
      5%, 25%       { opacity: 1; transform: translateY(0); }
    }
    /* 中段 */
    @keyframes subtitleMid {
      0%, 35%, 68%, 100% { opacity: 0; transform: translateY(10px); }
      40%, 63%           { opacity: 1; transform: translateY(0); }
    }
    /* 右段 */
    @keyframes subtitleRight {
      0%, 72%, 98% { opacity: 0; transform: translateY(10px); }
      77%, 93%     { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="cinema-window" id="cinemaWindow">

    <!-- 遠景背景：三張大圖交叉淡入淡出，固定往後退，不跟著圓筒轉 -->
    <div class="backdrop-slice slice-left"></div>
    <div class="backdrop-slice slice-mid"></div>
    <div class="backdrop-slice slice-right"></div>
    <div class="backdrop-vignette"></div>

    <!-- 360 度立體圓筒：只承載懸浮照片，各自獨立 rotateY／translateZ(450px)
         環繞在比背景近得多的距離，轉動時看得出明顯的靠近、遠離、左右
         穿梭——這是跟遠景背景之間「遠近視差」的來源。 -->
    <div class="carousel-3d" id="carousel3d">

      <div class="music-overlay"></div>

      <!-- 第一段照片：老城街道、城堡塔 -->
      <div class="photo-card c-size" id="photo-oldtown-street">
        <img src="surprise/image_fR_FA9.png" alt="老城街道合照">
        <div class="edge-vignette"></div>
      </div>
      <div class="photo-card b-size" id="photo-castle-tower">
        <img src="surprise/image_-rPWeY.png" alt="中世紀風合照">
        <div class="edge-vignette"></div>
      </div>

      <!-- 第二段照片：天文鐘樓群像 -->
      <div class="photo-card b-size" id="photo-clocktower">
        <img src="surprise/image_Ex9PZd.png" alt="天文鐘樓雙人合照">
        <div class="edge-vignette"></div>
      </div>
      <div class="photo-card c-size" id="photo-dr-closeup">
        <img src="surprise/image_7jQQNK.png" alt="單人溫柔特寫">
        <div class="edge-vignette"></div>
      </div>
      <div class="photo-card c-size" id="photo-janhus">
        <img src="surprise/image_5-SNAy.png" alt="胡斯雕像合照">
        <div class="edge-vignette"></div>
      </div>
      <div class="photo-card d-size" id="fragment-clock-death">
        <img src="surprise/image_KkSKiY.png" alt="天文鐘死神碎片">
        <div class="edge-vignette"></div>
      </div>
      <div class="photo-card d-size" id="fragment-apostles-mechanism">
        <img src="surprise/image__Oqjd2.png" alt="天文鐘內部使徒碎片">
        <div class="edge-vignette"></div>
      </div>

      <!-- 第三段照片：查理大橋橋塔 -->
      <div class="photo-card" id="photo-bridgetower">
        <img src="surprise/image_fUPCtw.png" alt="老城橋塔全景實景照">
        <div class="edge-vignette"></div>
      </div>
      <div class="photo-card c-size" id="photo-bridge-statue">
        <img src="surprise/image_9KIY5C.png" alt="聖方濟沙勿略雕像">
        <div class="edge-vignette"></div>
      </div>

    </div>

    <!-- 上層：固定不動的字幕層 -->
    <div class="subtitle-layer">
      <div class="movie-subtitle subtitle-left magenta-text">
        穿過火藥塔的陰影，<br>
        舊城開始慢慢亮起。
      </div>
      <div class="movie-subtitle subtitle-mid">
        <div class="movie-caption">Spring was not only a season. It was a sound.</div>
        <span class="magenta-text">春天不只是一個季節，<br>也是一座城市被音樂喚醒的聲音。</span>
      </div>
      <div class="movie-subtitle subtitle-right magenta-text">
        走到查理大橋時，<br>
        布拉格不再是景點，<br>
        而是一段會反覆播放的記憶。
      </div>
    </div>

  </div>

  <script>
    /* 本頁配樂：進頁淡入，離頁（無論往前往後翻）淡出，即使已翻過去也會慢慢收掉。
       透過 parent.SoundEngine 呼叫外層翻頁主程式共用的淡入／淡出引擎。
       改用 __onSpreadActivated／__onSpreadDeactivated（由 flipbook.js 在真正翻到本頁
       時才觸發），避免像舊寫法用 load 事件那樣，在背景預載時就被瀏覽器擋掉自動播放。 */
    (function () {
      function fadeIn() {
        try { parent.SoundEngine?.fadeInTrack?.('surprise/p06-beethoven9-finale.mp3', { volume: 0.6, fadeMs: 2500, loop: true }); } catch (e) {}
      }
      function fadeOut() {
        try { parent.SoundEngine?.fadeOutTrack?.({ fadeMs: 2000 }); } catch (e) {}
      }
      window.__onSpreadActivated = fadeIn;
      window.__onSpreadDeactivated = fadeOut;
      window.addEventListener('pagehide', fadeOut);
      window.addEventListener('beforeunload', fadeOut);
    })();
  </script>
</body>
</html>
