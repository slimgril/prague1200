<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P06｜布拉格之春的迴旋：舊城、橋影與深夜金光</title>
  <style>
    body {
      margin: 0;
      background: #050505;
      font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
      overflow-x: hidden;
    }

    /* 電影視窗：position:relative 讓固定字幕能定位；perspective 讓內部 3D 圓筒有立體深度
       （perspective 數值改由 JS 依半徑動態計算，這裡的 1800px 只是 JS 尚未執行前的備援值） */
    .cinema-window {
      width: 100%;
      height: 540px;
      overflow: hidden;
      position: relative;
      background: #000;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.95);
      margin: 40px 0;
      perspective: var(--cinema-perspective, 1800px);
    }

    /* 360 度立體圓筒：整體持續旋轉。
       【修正「三角錐」問題】原本只用 3 個大平面（每面 120 度）繞 Y 軸排列，
       相鄰兩面交界處的夾角太大，轉動時看起來像三片鏡子硬拼成的「三角柱」，
       完全不是圓筒。改成 12 個較窄的縱向面、每面只轉 30 度（3 段風景各佔 4
       面），多邊形輪廓大幅趨近圓形，轉動時不再有生硬的縱向折角。 */
    .carousel-3d {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      transform-style: preserve-3d;
      animation: carouselSpin 62s linear infinite;
      will-change: transform;
    }

    .cinema-window:hover .carousel-3d {
      animation-play-state: paused;
    }

    @keyframes carouselSpin {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(-360deg); }
    }

    /* 背景圓筒的一個縱向面：12 面平分 360 度（每面 30 度），半徑由 JS 依實際
       寬度動態算出（N 邊形內接半徑公式 w / (2·tan(π/N))，N=12），確保 12 面
       首尾相接、不露縫也不重疊。同一段風景的 4 面顯示同一張背景圖，內容
       完全一致、無縫相接，只有真正換場景的地方才有畫面變化，而且角度已
       縮小到 30 度，邊緣也有既有的漸層可以柔化交界。 */
    .bg-segment {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      background: #000;
    }
    .bg-seg-0  { transform: rotateY(0deg)   translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-1  { transform: rotateY(30deg)  translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-2  { transform: rotateY(60deg)  translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-3  { transform: rotateY(90deg)  translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-4  { transform: rotateY(120deg) translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-5  { transform: rotateY(150deg) translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-6  { transform: rotateY(180deg) translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-7  { transform: rotateY(210deg) translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-8  { transform: rotateY(240deg) translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-9  { transform: rotateY(270deg) translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-10 { transform: rotateY(300deg) translateZ(var(--carousel-radius, 900px)); }
    .bg-seg-11 { transform: rotateY(330deg) translateZ(var(--carousel-radius, 900px)); }

    /* 照片群：跟背景分段完全分離的獨立圖層（對應使用者建議的「小照片與背景
       分開圖層、各自 rotateY／translateZ」），各自維持原本 3 段
       （0°／120°／240°）的角度與淡入時機，只是不再直接畫在牆面上，而是貼
       在跟背景同一圓筒半徑的位置、疊在對應背景面前方——效果上像照片懸浮
       環繞在圓筒表面，而不是被拉伸成牆面的一部分。 */
    .photo-group {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .group-left  { transform: rotateY(0deg)   translateZ(var(--carousel-radius, 900px)); }
    .group-mid   { transform: rotateY(120deg) translateZ(var(--carousel-radius, 900px)); }
    .group-right { transform: rotateY(240deg) translateZ(var(--carousel-radius, 900px)); }

    /* 每一面的背景畫面 */
    .time-slice {
      width: 100%; height: 100%;
      background-size: cover; background-position: center;
      position: relative;
    }
    .slice-left  { background-image: url('surprise/image_oxeP6p.png');  filter: brightness(0.65) contrast(1.05); }
    .slice-mid   { background-image: url('surprise/image_111llO.png');  filter: brightness(0.6)  contrast(1.1);  }
    .slice-right { background-image: url('surprise/image_9KIY5C.png');  filter: brightness(0.35) contrast(1.15); }

    .time-slice::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(5,5,5,0.85) 0%, transparent 12%, transparent 88%, rgba(5,5,5,0.85) 100%);
      pointer-events: none;
    }

    .music-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 40%, rgba(212,175,55,0.06) 70%, transparent 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* 照片卡片 */
    .photo-card {
      position: absolute;
      box-shadow: 0 15px 35px rgba(0,0,0,0.65);
      border-radius: 4px;
      overflow: hidden;
    }
    .photo-card img { width: 100%; height: auto; display: block; }

    .edge-vignette {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 65%, rgba(5,5,5,0.45) 100%);
      pointer-events: none;
    }

    .b-size { width: 310px; border-radius: 6px; z-index: 10; }
    .c-size { width: 210px; border-radius: 4px; z-index: 12; border: 2px solid rgba(255,255,255,0.85); }
    .d-size { width: 125px; border-radius: 2px; z-index: 15; opacity: 0.78; }

    /* 座標已改為「相對各自所在的面」（0~100%），對應原本三段畫面各自的分組 */
    #photo-oldtown-street       { top: 24%; left: 12%; transform: rotate(-1.5deg); }
    #photo-castle-tower         { top: 10%; left: 54%; transform: rotate(2deg); }
    #photo-clocktower           { top: 16%; left: 8%;  transform: rotate(-2deg); }
    #photo-dr-closeup           { top: 6%;  left: 32%; transform: rotate(3deg); z-index: 14; }
    #photo-janhus               { top: 44%; left: 56%; transform: rotate(-3deg); }
    #fragment-clock-death       { bottom: 6%; left: 20%; transform: rotate(-8deg); filter: blur(0.3px); }
    #fragment-apostles-mechanism{ top: 12%; left: 74%; transform: rotate(6deg); }
    #photo-bridgetower          { top: 5%;  left: 22%; width: 320px; z-index: 10; filter: hue-rotate(35deg) brightness(0.32) contrast(1.15); }
    #photo-bridge-statue        { top: 8%;  left: 64%; width: 175px; transform: rotate(-1deg); }

    /* =====================================================
       字幕層：移出 panorama-rail，固定在 cinema-window 上
       ===================================================== */
    .subtitle-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    .movie-subtitle {
      position: absolute;
      width: 60%;
      left: 20%;
      color: rgba(255,255,255,0.95);
      font-size: 1.15rem; line-height: 1.8; letter-spacing: 0.15em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.95);
      text-align: center;
      opacity: 0;
    }
    .magenta-text { color: #ff007f; font-weight: 500; }
    .movie-caption { font-size: 1.35rem; font-weight: bold; letter-spacing: 0.05em; margin-bottom: 6px; }

    /* 三段字幕垂直位置（固定在視窗黃金比例） */
    .subtitle-left  { top: 42%; animation: subtitleLeft  62s linear infinite; }
    .subtitle-mid   { top: 38%; animation: subtitleMid   62s linear infinite; }
    .subtitle-right { top: 45%; animation: subtitleRight 62s linear infinite; }

    /* 左段：0~20秒 */
    @keyframes subtitleLeft {
      0%, 30%, 100% { opacity: 0; transform: translateY(10px); }
      5%, 25%       { opacity: 1; transform: translateY(0); }
    }
    /* 中段：20~45秒 */
    @keyframes subtitleMid {
      0%, 35%, 68%, 100% { opacity: 0; transform: translateY(10px); }
      40%, 63%           { opacity: 1; transform: translateY(0); }
    }
    /* 右段：45~60秒 */
    @keyframes subtitleRight {
      0%, 72%, 98% { opacity: 0; transform: translateY(10px); }
      77%, 93%     { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="cinema-window" id="cinemaWindow">

    <!-- 360 度立體圓筒：12 個縱向背景面（3 段風景各 4 面、每面 30 度）取代
         原本 3 個大平面，轉動時輪廓趨近圓形，不再是生硬的三角柱；
         照片群另外用獨立的 .photo-group 疊在對應背景前方（各自的 rotateY／
         translateZ 跟背景分開），效果是照片懸浮環繞、背景平滑圓筒。 -->
    <div class="carousel-3d" id="carousel3d">

      <!-- 背景：老城街道、城堡塔（4 面同一張場景，內容一致、無縫相接） -->
      <div class="bg-segment bg-seg-0"><div class="time-slice slice-left"></div></div>
      <div class="bg-segment bg-seg-1"><div class="time-slice slice-left"></div></div>
      <div class="bg-segment bg-seg-2"><div class="time-slice slice-left"></div></div>
      <div class="bg-segment bg-seg-3"><div class="time-slice slice-left"></div></div>

      <!-- 背景：天文鐘樓群像（4 面） -->
      <div class="bg-segment bg-seg-4"><div class="time-slice slice-mid"></div></div>
      <div class="bg-segment bg-seg-5"><div class="time-slice slice-mid"></div></div>
      <div class="bg-segment bg-seg-6"><div class="time-slice slice-mid"></div></div>
      <div class="bg-segment bg-seg-7"><div class="time-slice slice-mid"></div></div>

      <!-- 背景：查理大橋橋塔（4 面） -->
      <div class="bg-segment bg-seg-8"><div class="time-slice slice-right"></div></div>
      <div class="bg-segment bg-seg-9"><div class="time-slice slice-right"></div></div>
      <div class="bg-segment bg-seg-10"><div class="time-slice slice-right"></div></div>
      <div class="bg-segment bg-seg-11"><div class="time-slice slice-right"></div></div>

      <!-- 第一段照片：老城街道、城堡塔（角度／時機跟原本完全一樣，只是改成
           獨立圖層，疊在 bg-seg-0～3 前方） -->
      <div class="photo-group group-left">
        <div class="photo-card c-size" id="photo-oldtown-street">
          <img src="surprise/image_fR_FA9.png" alt="老城街道合照">
          <div class="edge-vignette"></div>
        </div>
        <div class="photo-card b-size" id="photo-castle-tower">
          <img src="surprise/image_-rPWeY.png" alt="中世紀風合照">
          <div class="edge-vignette"></div>
        </div>
      </div>

      <!-- 第二段照片：天文鐘樓群像 -->
      <div class="photo-group group-mid">
        <div class="music-overlay"></div>
        <div class="photo-card b-size" id="photo-clocktower">
          <img src="surprise/image_Ex9PZd.png" alt="天文鐘樓雙人合照">
          <div class="edge-vignette"></div>
        </div>
        <div class="photo-card c-size" id="photo-dr-closeup">
          <img src="surprise/image_7jQQNK.png" alt="單人溫柔特寫">
          <div class="edge-vignette"></div>
        </div>
        <div class="photo-card c-size" id="photo-janhus">
          <img src="surprise/image_5-SNAy.png" alt="胡斯雕像合照">
          <div class="edge-vignette"></div>
        </div>
        <div class="photo-card d-size" id="fragment-clock-death">
          <img src="surprise/image_KkSKiY.png" alt="天文鐘死神碎片">
          <div class="edge-vignette"></div>
        </div>
        <div class="photo-card d-size" id="fragment-apostles-mechanism">
          <img src="surprise/image__Oqjd2.png" alt="天文鐘內部使徒碎片">
          <div class="edge-vignette"></div>
        </div>
      </div>

      <!-- 第三段照片：查理大橋橋塔 -->
      <div class="photo-group group-right">
        <div class="photo-card" id="photo-bridgetower">
          <img src="surprise/image_fUPCtw.png" alt="老城橋塔全景實景照">
          <div class="edge-vignette"></div>
        </div>
        <div class="photo-card c-size" id="photo-bridge-statue">
          <img src="surprise/image_9KIY5C.png" alt="聖方濟沙勿略雕像">
          <div class="edge-vignette"></div>
        </div>
      </div>

    </div>

    <!-- 上層：固定不動的字幕層 -->
    <div class="subtitle-layer">
      <div class="movie-subtitle subtitle-left magenta-text">
        穿過火藥塔的陰影，<br>
        舊城開始慢慢亮起。
      </div>
      <div class="movie-subtitle subtitle-mid">
        <div class="movie-caption">Spring was not only a season. It was a sound.</div>
        <span class="magenta-text">春天不只是一個季節，<br>也是一座城市被音樂喚醒的聲音。</span>
      </div>
      <div class="movie-subtitle subtitle-right magenta-text">
        走到查理大橋時，<br>
        布拉格不再是景點，<br>
        而是一段會反覆播放的記憶。
      </div>
    </div>

  </div>

  <script>
    /* 立體圓筒半徑：依實際渲染寬度算出「12 邊形」的 translateZ 半徑
       （N 邊形內接半徑公式 w / (2·tan(π/N))，N=12），撐開後 12 面才會
       剛好首尾相接、不露縫也不重疊，而且因為面數變多、角度變小，整體
       輪廓會接近圓形，不再是原本 N=3 時那種一眼就看得出來的三角柱。
       perspective 隨半徑等比放大，避免面數變多、半徑跟著變大之後，
       正面的面因為離攝影機太近而變形過度或穿框。 */
    (function () {
      const cinemaWindow = document.getElementById('cinemaWindow');
      const carousel = document.getElementById('carousel3d');
      const SEGMENTS = 12; // 3 段風景 × 每段 4 面
      function updateRadius() {
        const w = cinemaWindow.offsetWidth;
        const radius = Math.round(w / (2 * Math.tan(Math.PI / SEGMENTS)));
        carousel.style.setProperty('--carousel-radius', radius + 'px');
        // perspective 用固定倍率 3.5 換算（perspective/(perspective-radius) 這個
        // 「放大倍率」只跟這個倍率有關、跟半徑本身無關），確保面數變多、半徑
        // 跟著變大之後，畫面的放大程度維持一致，不會變成貼到鏡頭前的特寫。
        cinemaWindow.style.setProperty('--cinema-perspective', Math.round(radius * 3.5) + 'px');
      }
      updateRadius();
      window.addEventListener('resize', updateRadius);
    })();

    /* 本頁配樂：進頁淡入，離頁（無論往前往後翻）淡出，即使已翻過去也會慢慢收掉。
       透過 parent.SoundEngine 呼叫外層翻頁主程式共用的淡入／淡出引擎。
       改用 __onSpreadActivated／__onSpreadDeactivated（由 flipbook.js 在真正翻到本頁
       時才觸發），避免像舊寫法用 load 事件那樣，在背景預載時就被瀏覽器擋掉自動播放。 */
    (function () {
      function fadeIn() {
        try { parent.SoundEngine?.fadeInTrack?.('surprise/p06-beethoven9-finale.mp3', { volume: 0.6, fadeMs: 2500, loop: true }); } catch (e) {}
      }
      function fadeOut() {
        try { parent.SoundEngine?.fadeOutTrack?.({ fadeMs: 2000 }); } catch (e) {}
      }
      window.__onSpreadActivated = fadeIn;
      window.__onSpreadDeactivated = fadeOut;
      window.addEventListener('pagehide', fadeOut);
      window.addEventListener('beforeunload', fadeOut);
    })();
  </script>
</body>
</html>
